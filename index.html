<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CCDV-F Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* Layout: one column, answer-sheet feel. A sticky coverage strip on top, the question card as the single focus, tools as flat tabs. */
:root{
  --bg:#262624; --surface:#30302E; --surface-2:#3A3A37; --ink:#FAF9F5; --ink-2:#B0AEA5; --line:#55534D;
  --accent:#E08A66; --accent-ink:#1A1915; --accent-soft:#43332B;
  --good:#7BCB8F; --good-bg:#26362B; --bad:#F4897C; --bad-bg:#3C2624; --warn:#E5B567; --warn-bg:#3A3122;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
/* Scuro è il tema di base e non dipende dal tema del visualizzatore. Il tema chiaro si attiva solo dal pulsante in alto. */
:root[data-skin="light"]{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#E3E8F0; --ink:#0F1B2D; --ink-2:#4B5A70; --line:#C7D0DC;
  --accent:#1F4BD8; --accent-ink:#FFFFFF; --accent-soft:#DCE5FF;
  --good:#17724A; --good-bg:#DCF2E5; --bad:#B3261E; --bad-bg:#FBE0DD; --warn:#8A5300; --warn-bg:#FFEFCF;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:14px 56px}
.mono{font-family:var(--f-mono)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px}
.brand h1{margin:0;font-family:var(--f-display);font-stretch:85%;font-weight:760;font-size:26px;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:2px 0 0;font:600 11px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.hr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.skin{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 10px;min-height:36px;font-size:13px;font-weight:600}
.skin:hover{border-color:var(--accent)}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-2);display:inline-block}
.sync.on i{background:var(--good)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tab{padding:8px 13px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-weight:600;font-size:14.5px;min-height:40px}
.tab[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab .cnt{font:600 11.5px var(--f-mono);margin-left:6px;color:var(--bad)}
.tab[aria-current="page"] .cnt{color:inherit;opacity:.85}

/* coverage strip */
.cov{margin-top:12px;background:var(--surface);border:1px solid var(--line);padding:10px 14px;display:grid;gap:8px}
.cov-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;font-size:14px}
.cov-row b{font-family:var(--f-display);font-stretch:90%;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.cov-row span{color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s}
.bar.good i{background:var(--good)}

main{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);padding:18px 18px 16px}
.card + .card{margin-top:12px}

/* question */
.qcard{border-top:4px solid var(--accent)}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-2)}
.chip{font:600 11.5px var(--f-mono);background:var(--surface-2);color:var(--ink);padding:3px 7px;letter-spacing:.02em}
.chip.state{background:transparent;border:1px solid var(--line)}
.chip.state.learn{border-color:var(--bad);color:var(--bad)}
.chip.state.half{border-color:var(--warn);color:var(--warn)}
.chip.state.done{border-color:var(--good);color:var(--good)}
.chip.kind{background:var(--accent-soft);color:var(--accent)}
.qtext{font-family:var(--f-body);font-weight:600;font-size:19px;line-height:1.4;margin:14px 0 16px;text-wrap:pretty;overflow-wrap:anywhere}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr auto;align-items:start;gap:12px;width:100%;text-align:left;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .mark{width:30px;height:30px;border:2px solid var(--ink-2);border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-mono);color:var(--ink-2);background:var(--surface)}
.opt.multi .mark{border-radius:5px}
.opt .otext{min-width:0;overflow-wrap:anywhere;padding-top:3px}
.opt .tag{font:600 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding-top:6px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .mark{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.ok .tag{color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .mark{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.no .tag{color:var(--bad)}
.opt.miss{border-color:var(--good);border-style:dashed}
.opt.miss .mark{border-color:var(--good);color:var(--good)}
.opt.miss .tag{color:var(--good)}
.opt.dim{opacity:.62}
.opt[disabled]{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{padding:10px 18px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;min-height:44px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn small{font:500 11px var(--f-mono);opacity:.7;margin-left:6px}

/* feedback */
.fb{margin-top:16px;border-left:4px solid var(--line);padding:2px 0 2px 14px}
.fb.ok{border-color:var(--good)} .fb.no{border-color:var(--bad)}
.fb h3{margin:0 0 2px;font-family:var(--f-display);font-stretch:90%;font-weight:720;font-size:18px}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.fb .next{font-size:13.5px;color:var(--ink-2);margin:0 0 8px}
.fb .why{margin:0 0 10px;overflow-wrap:anywhere}
.term{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13.5px;color:var(--ink-2)}
.term b{font:600 12.5px var(--f-mono);color:var(--ink);background:var(--surface-2);padding:2px 7px;overflow-wrap:anywhere}

/* note personali */
.chip.hasnote{background:var(--warn-bg);color:var(--warn)}
details.nt{margin-top:16px;background:var(--surface);border:1px solid var(--line)}
details.nt > summary{display:flex;align-items:center;gap:4px 10px;padding:8px 14px;min-height:44px;cursor:pointer;list-style:none}
details.nt > summary::-webkit-details-marker{display:none}
details.nt > summary::before{content:"+";flex:none;width:14px;font:600 15px var(--f-mono);color:var(--ink-2)}
details.nt[open] > summary::before{content:"\2212"}
details.nt .nl{flex:none;font-weight:600}
details.nt .pv{min-width:0;flex:1 1 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--ink-2)}
details.nt .pv.empty{font-style:italic}
.nt-body{display:grid;gap:8px;padding:2px 14px 12px}
.nt-body textarea{display:block;width:100%;min-height:150px;max-height:65vh;resize:vertical;padding:10px 12px;font:16px/1.5 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
.nt-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.nt-tools .btn{min-height:36px;padding:6px 12px;font-size:14px}
textarea.exp{display:block;width:100%;margin-top:10px;padding:10px 12px;font:13px/1.5 var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}

/* sessione */
.sess{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--ink-2);margin-bottom:10px;font-variant-numeric:tabular-nums}
.sess b{color:var(--ink)}
.scope{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;font-size:14px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* empty / info */
.big{font-family:var(--f-display);font-stretch:88%;font-weight:740;font-size:24px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.muted{color:var(--ink-2)}
.note{background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn);padding:10px 14px;font-size:14.5px}

/* competenze / progressi */
.dom{background:var(--surface);border:1px solid var(--line)}
.dom + .dom{margin-top:10px}
.dom > header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;padding:12px 14px 8px}
.dom h3{margin:0;font-family:var(--f-display);font-stretch:90%;font-weight:720;font-size:17px}
.dom .w{font:600 12px var(--f-mono);color:var(--ink-2)}
.dom .bar{margin:0 14px 6px}
.sk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:10px 14px;border:0;border-top:1px solid var(--line);background:transparent;border-radius:0}
button.sk:hover{background:var(--surface-2)}
.sk .nm{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;min-width:0}
.sk .nm span{overflow-wrap:anywhere}
.sk .ct{font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.sk .bar{grid-column:1 / -1;margin:2px 0 0;height:5px}
.sk .meta{grid-column:1 / -1;font-size:12.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-stretch:88%;font-weight:760;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}

/* simulazione */
.simbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;background:var(--surface);border:1px solid var(--line);padding:8px 14px;margin-bottom:10px}
.simbar .tm{font:600 22px var(--f-mono);font-variant-numeric:tabular-nums}
.simbar .tm.low{color:var(--bad)}
.navg{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin-top:14px}
.nb{min-height:38px;border:1px solid var(--line);background:var(--surface);border-radius:5px;font:600 13px var(--f-mono);position:relative;font-variant-numeric:tabular-nums}
.nb.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.nb.cur{outline:3px solid var(--ink);outline-offset:1px}
.nb.flag::after{content:"";position:absolute;top:2px;right:2px;width:8px;height:8px;background:var(--warn);border-radius:50%}
.res{display:grid;gap:10px}
details.rv{background:var(--surface);border:1px solid var(--line)}
details.rv + details.rv{margin-top:8px}
details.rv summary{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv summary .sg{font:700 14px var(--f-mono);width:18px;flex:none}
details.rv summary .sg.ok{color:var(--good)} details.rv summary .sg.no{color:var(--bad)}
details.rv summary .st{min-width:0;overflow-wrap:anywhere}
details.rv .inner{padding:4px 14px 14px;border-top:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
table.t td:nth-child(n+2),table.t th:nth-child(n+2){text-align:right}
.tw{overflow-x:auto}
.foot{margin-top:22px;font-size:12.5px;color:var(--ink-2)}
@media (max-width:480px){
  .qtext{font-size:18px}
  .card{padding:14px 12px}
  .opt{grid-template-columns:30px 1fr auto;gap:10px;padding:10px}
  .opt .mark{width:28px;height:28px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>CCDV-F Drill</h1>
      <p>Claude Certified Developer · Foundations</p>
    </div>
    <div class="hr">
      <div class="sync" id="sync" title="Dove vengono salvati i progressi"><i></i><span id="syncTxt">Solo su questo browser</span></div>
      <button class="skin" id="skinBtn" type="button">Tema chiaro</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sezioni"></nav>
  <section class="cov" id="cov" aria-label="Copertura della banca"></section>
  <main id="main"></main>
</div>

<script>
const BANK = [{"id":"AA-01","s":"AA","t":"s","q":"A support platform always handles a ticket in the same three steps: classify it, look up the customer's account, then draft a reply. The steps and their order never change. Which architecture fits best?","o":["An autonomous agent that chooses its own steps at runtime","A workflow: LLM calls orchestrated through a predefined code path","A supervisor agent that spawns a new subagent for each step","A single long prompt with no tools and no code orchestration"],"a":[1],"e":"Anthropic distinguishes workflows (LLMs and tools orchestrated through predefined code paths) from agents (LLMs that dynamically direct their own process and tool usage). When the steps are known in advance, a workflow is simpler, cheaper, faster and more predictable.","k":"workflow vs agent","src":"Building effective agents"},{"id":"AA-02","s":"AA","t":"s","q":"Which statement correctly distinguishes a workflow from an agent in Anthropic's terminology?","o":["Workflows let the LLM decide each step at runtime; agents follow a code path fixed by the developer","Workflows use predefined code paths; in an agent the LLM dynamically directs its own process and tool usage","Workflows are single LLM calls with one prompt; agents are any system that makes more than one LLM call","Workflows are limited to one tool per request; agents may call several tools in parallel in one turn"],"a":[1],"e":"A workflow is LLMs and tools orchestrated through predefined code paths. An agent is a system where the LLM dynamically directs its own process and tool usage, maintaining control over how it accomplishes the task.","k":"workflow, agent","src":"Building effective agents"},{"id":"AA-03","s":"AA","t":"s","q":"A team generates marketing copy and then translates it into another language, with a programmatic check between the two steps. Which workflow pattern is this?","o":["Orchestrator-workers","Prompt chaining","Parallelization","Evaluator-optimizer"],"a":[1],"e":"Prompt chaining decomposes a task into a fixed sequence of steps where each LLM call processes the previous output, optionally with programmatic gates between steps. It trades latency for accuracy by making each call an easier task.","k":"prompt chaining","src":"Building effective agents"},{"id":"AA-04","s":"AA","t":"s","q":"A chatbot receives refund requests, technical questions and general inquiries. Each type needs its own prompt, tools and possibly model size. Which pattern classifies the input and directs it to a specialized follow-up task?","o":["Routing","Voting","Prompt chaining","Sectioning"],"a":[0],"e":"Routing classifies an input and sends it to a specialized downstream task. It enables separation of concerns, so optimizing for one input type does not degrade performance on the others.","k":"routing","src":"Building effective agents"},{"id":"AA-05","s":"AA","t":"s","q":"A code-review pipeline runs the same vulnerability-review prompt several times and flags the code if any run reports a problem. Which variation of parallelization is this?","o":["Sectioning","Voting","Prompt chaining","Routing"],"a":[1],"e":"Parallelization has two variations. Sectioning splits a task into independent subtasks run in parallel. Voting runs the same task multiple times to get diverse outputs and aggregates them.","k":"parallelization, voting","src":"Building effective agents"},{"id":"AA-06","s":"AA","t":"s","q":"One model call answers the user's request while a separate, smaller model call screens the same request for policy violations at the same time. The two calls do not depend on each other. Which variation of parallelization is this?","o":["Voting","Sectioning","Routing","Prompt chaining"],"a":[1],"e":"Sectioning breaks a task into independent subtasks that run in parallel, for example one instance does the work while another runs a guardrail check.","k":"parallelization, sectioning","src":"Building effective agents"},{"id":"AA-07","s":"AA","t":"s","q":"A coding request may touch an unpredictable number of files, and which files are affected depends on the request itself. Which pattern lets a central LLM decide the subtasks at runtime, delegate them and synthesize the results?","o":["Prompt chaining","Parallelization","Orchestrator-workers","Evaluator-optimizer"],"a":[2],"e":"In orchestrator-workers a central LLM dynamically breaks the task down, delegates to worker LLMs and synthesizes their results. Unlike parallelization, the subtasks are not predefined.","k":"orchestrator-workers","src":"Building effective agents"},{"id":"AA-08","s":"AA","t":"s","q":"Which situation best fits the evaluator-optimizer pattern?","o":["Literary translation, where a second LLM critiques each draft against clear criteria and feedback improves it","Sending refund, billing and technical questions to separate prompts based on the message type","Splitting a coding request into subtasks whose number depends on what the request turns out to need","Running one vulnerability-review prompt several times and flagging the code if any run reports a problem"],"a":[0],"e":"Evaluator-optimizer pairs a generating LLM with an evaluating LLM in a loop. It works when there are clear evaluation criteria and iterative refinement measurably improves the output.","k":"evaluator-optimizer","src":"Building effective agents"},{"id":"AA-09","s":"AA","t":"m","q":"Select TWO conditions under which an agent, rather than a fixed workflow, is the appropriate choice.","o":["The required steps cannot be predicted or hardcoded in advance","The task follows a known sequence of steps for every request","The environment is trusted or sandboxed and guardrails are in place","Cost and latency per request must stay low and predictable"],"a":[0,2],"e":"Agents suit open-ended problems where the path cannot be hardcoded, and they should run in environments you can trust or sandbox, with guardrails. They bring higher cost, latency and the risk of compounding errors.","k":"when to use agents","src":"Building effective agents"},{"id":"AA-10","s":"AA","t":"s","q":"What is the main trade-off Anthropic highlights when choosing an agent over a workflow?","o":["Agents are cheaper to run than workflows, but output quality varies","Agents can handle open-ended tasks, but they cost more and errors can compound","Agents run faster and more predictably, but struggle with open-ended tasks","Agents require a fine-tuned model, which costs more to train but less to run"],"a":[1],"e":"Agents handle sophisticated open-ended tasks but typically trade higher cost and latency, and carry the potential for compounding errors, for that flexibility. Sandboxing and guardrails mitigate the risk.","k":"agent trade-offs","src":"Building effective agents"},{"id":"AA-11","s":"AA","t":"s","q":"Why do orchestrator agents often delegate exploration work (large searches, log reading) to subagents?","o":["Subagents share the parent's context window, so the parent sees every file the subagent opens","Each subagent works in its own context window and returns only a summary, keeping the parent's context focused","Each subagent adds its own window to the parent's, extending the combined context past the model's limit","Subagents return their full transcript to the parent, which then filters out the irrelevant parts on its own"],"a":[1],"e":"A subagent runs in an isolated context window. Verbose intermediate output stays there and only the result returns to the parent, which limits context growth and context rot.","k":"subagents, context isolation","src":"Claude Code subagents"},{"id":"AA-12","s":"AA","t":"s","q":"A single agent has 60 tools spanning billing, shipping and HR, and it often picks the wrong one. Which architectural change best addresses this?","o":["Add more tools so every billing, shipping and HR edge case is covered by a dedicated option","Introduce a supervisor that delegates to specialist subagents, each with a narrow tool set and focused instructions","Set tool_choice to any so the model is forced to call one of the 60 tools on each turn","Raise the sampling temperature so the model explores a wider range of tool choices before committing"],"a":[1],"e":"Tool selection accuracy degrades once an agent has more than about 30 to 50 tools. Splitting the work across specialist subagents, each with a narrow tool set and focused instructions, reduces selection ambiguity (deferring tool definitions with the tool search tool is another option). Adding more tools or raising temperature does not fix mis-selection.","k":"supervisor hierarchy, subagents","src":"Tool search tool; Writing tools for agents"},{"id":"AA-13","s":"AA","t":"s","q":"According to Anthropic's guidance on building agentic systems, where should a team begin?","o":["With a multi-agent framework that handles planning, memory and tool routing, trimming features later","With direct LLM API calls and the simplest solution, adding complexity only when it demonstrably improves outcomes","By fine-tuning a dedicated model on your task data, then adding prompts and tools if accuracy falls short","With a fully autonomous agent that has broad tool access, adding guardrails after problems appear"],"a":[1],"e":"Anthropic recommends starting simple: many patterns take only a few lines of code with direct API calls. Add complexity only when it demonstrably improves results.","k":"simplicity","src":"Building effective agents"},{"id":"AA-14","s":"AA","t":"m","q":"Select THREE core principles Anthropic recommends for building agents.","o":["Maintain simplicity in the design","Prioritize transparency by showing the agent's explicit planning steps","Carefully craft the agent-computer interface with thorough tool documentation and testing","Maximize autonomy by removing human checkpoints so the agent runs without interruption","Hide intermediate reasoning and planning steps so the final output stays concise"],"a":[0,1,2],"e":"The three principles are simplicity, transparency (explicit planning steps) and a carefully crafted agent-computer interface (ACI) with good documentation and testing.","k":"simplicity, transparency, ACI","src":"Building effective agents"},{"id":"AC-01","s":"AC","t":"s","q":"You want to embed Claude Code's agent loop, built-in tools, permissions and sessions in your own Python application, running in a process you operate. Which option fits?","o":["Claude Agent SDK","Claude Managed Agents","Client SDK + your own loop","claude.ai Projects"],"a":[0],"e":"The Agent SDK is a Python and TypeScript library that gives you Claude Code's agent loop, built-in tools, hooks, subagents, MCP, permissions and sessions in your own process. Managed Agents is hosted by Anthropic; the Client SDK gives direct API access and you write the loop yourself.","k":"Claude Agent SDK","src":"Agent SDK overview"},{"id":"AC-02","s":"AC","t":"s","q":"Which option runs the agent loop on Anthropic-managed infrastructure, is configured through the Claude API, and suits long-running asynchronous tasks?","o":["Claude Managed Agents","The Messages API alone","The Agent SDK, in-process","The Claude Code CLI"],"a":[0],"e":"Claude Managed Agents is a pre-built, configurable agent harness that runs in managed infrastructure, best for long-running tasks and asynchronous work.","k":"Claude Managed Agents","src":"Managed Agents overview"},{"id":"AC-03","s":"AC","t":"s","q":"Which set lists the four core concepts of Claude Managed Agents?","o":["Agent, Environment, Session, Events","Model, Prompt, Toolset, Response","Workspace, Project, Skill, Vault","Planner, Executor, Critic, Memory Store"],"a":[0],"e":"An Agent is the model, system prompt, tools, MCP servers and skills. An Environment is where sessions run. A Session is a running agent instance. Events are the messages exchanged between your application and the agent.","k":"Agent, Environment, Session, Events","src":"Managed Agents overview"},{"id":"AC-04","s":"AC","t":"s","q":"In Claude Managed Agents, what does an Environment configure?","o":["Where sessions run: an Anthropic-managed cloud sandbox or a self-hosted sandbox on your own infrastructure","Which model, system prompt and tools the agent uses, plus the MCP servers and skills it can reach at runtime","How your application and the agent exchange messages, including user turns and status updates","A single running agent instance: its conversation history, outputs and the task it is performing"],"a":[0],"e":"An Environment defines where sessions run: an Anthropic-managed cloud sandbox, or a self-hosted sandbox on infrastructure you control.","k":"Environment, self-hosted sandbox","src":"Managed Agents overview"},{"id":"AC-05","s":"AC","t":"s","q":"A regulated customer wants the Managed Agents harness but requires tool execution to happen on infrastructure they control. What addresses this?","o":["A self-hosted sandbox environment","Turning off the bash tool for the agent","Switching to the Message Batches API","Enabling prompt caching on every tool"],"a":[0],"e":"Managed Agents supports self-hosted sandboxes for compliance or data-residency requirements, so execution stays on your own infrastructure.","k":"self-hosted sandbox","src":"Managed Agents overview"},{"id":"AC-06","s":"AC","t":"s","q":"What does every Claude Managed Agents endpoint require while the feature is in beta?","o":["The managed-agents-2026-04-01 beta header (the SDK sets it automatically)","The agents-2025-09-01 beta header, which the SDK sets automatically","A separate API key issued from the Managed Agents settings page","The anthropic-version header set to 2026-04-01 instead of 2023-06-01"],"a":[0],"e":"All Managed Agents endpoints require the managed-agents-2026-04-01 beta header. The SDK adds it for you.","k":"managed-agents-2026-04-01","src":"Managed Agents overview"},{"id":"AC-07","s":"AC","t":"s","q":"Why is Claude Managed Agents not currently eligible for Zero Data Retention (ZDR) coverage?","o":["It is stateful by design: sessions store conversation history, sandbox state and outputs server-side","It is limited to Claude Haiku models, which fall outside the scope of ZDR agreements","It uses a different tokenizer, so token counts for retention logging differ from the standard API","It streams every event over server-sent connections that Anthropic logs for abuse monitoring"],"a":[0],"e":"Managed Agents sessions are long-running and stateful, storing history, sandbox state and outputs server-side. You can still delete sessions and uploaded files through the API.","k":"stateful sessions, ZDR","src":"Managed Agents overview"},{"id":"AC-08","s":"AC","t":"s","q":"Which statement about authentication for products built on the Agent SDK is correct?","o":["Third-party developers should use API key authentication, not offer claude.ai login or its rate limits to their own users","Third-party developers may offer claude.ai login to their own users as long as Anthropic branding is shown","The SDK rejects API keys and expects each end user to sign in with their own claude.ai subscription","Developers should proxy their end users' requests through their own claude.ai account to share one rate limit"],"a":[0],"e":"Unless previously approved, Anthropic does not allow third-party developers to offer claude.ai login or rate limits in products built on the Agent SDK. Use API key authentication instead.","k":"API key authentication","src":"Agent SDK overview"},{"id":"AC-09","s":"AC","t":"s","q":"In a hand-written agent loop over the Messages API, which condition should keep the loop running?","o":["stop_reason is tool_use","stop_reason is end_turn","stop_reason is max_tokens","The response includes text"],"a":[0],"e":"Loop while stop_reason is tool_use: execute the tools, send tool_result blocks in a user message and call again. A pause_turn from a server tool also means the work continues. Exit on end_turn, max_tokens, stop_sequence or refusal, and handle each.","k":"stop_reason: tool_use","src":"How tool use works"},{"id":"AC-10","s":"AC","t":"s","q":"A custom agent loop uses the server-executed web search tool and receives stop_reason pause_turn. What should the application do?","o":["Treat the paused response as final and show the partial answer to the user","Re-send the conversation, including the paused response, so the model can continue","Switch to a larger model with a longer context window and resend the original prompt","Raise max_tokens and send the original request again from the beginning of the turn"],"a":[1],"e":"The server-side loop has an iteration limit. pause_turn means the work is not finished: send the conversation back, including the paused response, to let the model continue where it left off.","k":"pause_turn","src":"How tool use works"},{"id":"AC-11","s":"AC","t":"s","q":"Which pair correctly matches tools to who executes them?","o":["User-defined tools: your application. Web search: Anthropic's servers","User-defined tools: Anthropic's servers. Web search: your own application","bash tool: Anthropic's servers. Code execution: your application","memory tool: Anthropic's servers. Web fetch: your application"],"a":[0],"e":"User-defined tools and Anthropic-schema tools (memory, bash, text_editor, computer, browser) are client-executed. web_search, web_fetch, code_execution and tool_search are server-executed.","k":"client tools vs server tools","src":"How tool use works"},{"id":"AC-12","s":"AC","t":"s","q":"What does the SDK's tool runner (beta) do?","o":["Drives the tool-use loop for you: executes tools, formats tool_result blocks and continues until the model is done","Hosts your tool functions on Anthropic's servers and executes them there, returning the results to the model automatically","Converts your tool definitions into MCP servers and registers them with the Claude API on every request","Caches tool_result blocks between requests so repeated calls with the same input are skipped"],"a":[0],"e":"The tool runner manages the tool_use loop, result formatting and retries so you do not write the loop manually.","k":"Tool Runner","src":"Handle tool calls"},{"id":"AC-13","s":"AC","t":"s","q":"Which feature runs deterministic code at defined points in an agent's lifecycle (for example before a tool call), rather than relying on the model to remember a rule?","o":["Hooks","Skills","Subagents","Prefill"],"a":[0],"e":"Hooks are user-defined handlers that execute automatically at lifecycle events, giving deterministic control over actions such as blocking a tool call.","k":"hooks","src":"Claude Code hooks"},{"id":"AC-14","s":"AC","t":"s","q":"An agent must resume a previous conversation with its context intact, or branch from it. Which Agent SDK capability supports this?","o":["Sessions (resume or fork)","Plugins (bundled extensions)","MCP elicitation requests","Message batching (async)"],"a":[0],"e":"The Agent SDK maintains context across exchanges through sessions, which you can resume or fork later.","k":"sessions","src":"Agent SDK overview"},{"id":"AC-15","s":"AC","t":"s","q":"Your team writes in a language other than Python or TypeScript but wants the Claude Code agent loop. What do the docs suggest?","o":["Run the Claude Code CLI as a subprocess with -p and --output-format json","Reimplement the agent loop yourself against the Messages API with your own tool runner","Embed the Claude Code VS Code extension and drive it through its editor API","Pipe prompts into the interactive CLI and scrape the terminal output for results"],"a":[0],"e":"To drive the same agent loop from another language, run the CLI as a subprocess with the -p flag and --output-format json.","k":"claude -p","src":"Agent SDK overview"},{"id":"AC-16","s":"AC","t":"s","q":"How does the Claude Agent SDK relate to Claude Code?","o":["It exposes the same tools, agent loop and context management that power Claude Code as a Python and TypeScript library","It is a separate agent loop with no built-in tools, so you implement the file and shell tools yourself","It is a hosted service that runs agents on Anthropic infrastructure and is configured through the Claude API and the ant CLI","It is a thin wrapper over the Messages API that adds streaming and retries but no agent loop or built-in tools"],"a":[0],"e":"The Agent SDK lets you build agents with the same built-in tools, agent loop and context management as Claude Code, running in your own process.","k":"Claude Agent SDK","src":"Agent SDK overview"},{"id":"AP-01","s":"AP","t":"s","q":"What is the tool-use loop pattern?","o":["The model requests a tool call, your code executes it, the result is returned, and the model continues until it stops requesting tools","The model executes each tool inside its own context window and returns the combined output in a single final turn","The client sends the same request repeatedly, adjusting the temperature each time, until the response finally passes your schema validation","Your code calls every tool first and prepends all results to the prompt, so the model answers in one turn with no loop"],"a":[0],"e":"The tool-use loop is the core agent pattern: stop_reason tool_use, execute, return a tool_result, repeat until another stop reason.","k":"tool-use loop","src":"How tool use works"},{"id":"AP-02","s":"AP","t":"s","q":"The memory tool is an Anthropic-schema tool. Who executes its operations?","o":["Your application, which handles the file operations","Anthropic's servers, which store the files for you","The model itself, writing files into its own context window","A sandboxed container that Anthropic provisions per request"],"a":[0],"e":"The memory tool is a client-executed Anthropic-schema tool: Claude emits tool_use blocks and your application performs the reads and writes, so you control where and how memory is stored.","k":"memory tool","src":"How tool use works"},{"id":"AP-03","s":"AP","t":"s","q":"What is the main purpose of the memory tool in an agent?","o":["To persist information outside the context window so it survives across conversations and context resets","To enlarge the model's context window so longer conversations fit without any summarization","To cache the system prompt and tool definitions so repeated requests are cheaper and faster","To fine-tune the model's weights on facts learned in earlier conversations so that it recalls them later on"],"a":[0],"e":"Memory lets an agent store and retrieve information across sessions, which is key for long-running or multi-session work where the context window alone is not enough.","k":"memory, persistence","src":"Context windows"},{"id":"AP-04","s":"AP","t":"s","q":"How do server-side compaction and context editing differ?","o":["Compaction replaces older turns with a model-written summary; context editing clears selected tool results or thinking blocks by rule","Compaction clears selected tool results by rule; context editing replaces older turns with a model-written summary","Compaction truncates the oldest turns without summarizing them; context editing rewrites the system prompt on the client each turn to save tokens","Compaction drops every turn older than the last user message; context editing drops every turn older than the last tool call"],"a":[0],"e":"Compaction summarizes earlier turns on the server so a conversation can continue. Context editing removes selected content by rule (clear_tool_uses, clear_thinking) without summarizing.","k":"compaction, context editing","src":"Compaction overview"},{"id":"AP-05","s":"AP","t":"s","q":"What caution does Anthropic give about agentic abstraction frameworks?","o":["They can obscure the underlying prompts and responses and make debugging harder, so understand the code beneath them","They hard-code a single model provider, so you should rewrite their prompts before any production release","They reduce token usage by compressing prompts, but that makes outputs less accurate than direct API calls","They are unsupported with Claude models, so any framework call to the Claude API falls outside the usage policy"],"a":[0],"e":"Frameworks simplify standard tasks, but the extra layers can hide prompts and responses. Make sure you understand the underlying code before relying on them.","k":"agentic frameworks","src":"Building effective agents"},{"id":"AP-06","s":"AP","t":"m","q":"Select TWO agentic abstraction frameworks.","o":["LangGraph","PydanticAI","pandas","NumPy"],"a":[0,1],"e":"LangGraph and PydanticAI (and Strands Agents) are agent frameworks. pandas and NumPy are data libraries.","k":"LangGraph, PydanticAI, Strands","src":"Exam blueprint"},{"id":"AP-07","s":"AP","t":"s","q":"What does a task budget give Claude on an agentic task?","o":["An advisory token budget for the whole agentic loop that helps the model self-regulate on long tasks","A hard cap on total output tokens for the whole loop that aborts the request once it is reached","A guaranteed maximum price per task that Anthropic bills however many tokens are used","An expanded context window reserved for the agentic loop, so long tasks need no compaction"],"a":[0],"e":"Task budgets (beta) give Claude an advisory token budget for the full agentic loop so it can pace itself on long-running work. It is advisory, not a hard stop. It is set with output_config.task_budget in beta; max_tokens remains the enforced per-request cap.","k":"task budgets","src":"Task budgets"},{"id":"AP-08","s":"AP","t":"s","q":"Which models automatically receive injected token-budget tracking (context awareness) in their system prompt?","o":["Claude Sonnet 5, Sonnet 4.6, Sonnet 4.5 and Haiku 4.5","Claude Opus 4.1, Claude Sonnet 4 and Claude Haiku 3.5","All Claude models except those in the smaller Haiku tier","No model; you add the budget tags to your own system prompt"],"a":[0],"e":"Context awareness is automatic on Claude Sonnet 5, Sonnet 4.6, Sonnet 4.5 and Haiku 4.5: the API injects the token budget into the context and updates it after tool calls, so the model can pace itself. Opus 4.7 and later, Sonnet 5.5, Fable and Mythos models do not receive the injected tags and use task budgets instead.","k":"context awareness","src":"Context windows"},{"id":"AP-09","s":"AP","t":"s","q":"For agents that span multiple sessions, what design principle do the docs recommend?","o":["Design state artifacts so context recovery is fast when a new session starts","Keep all progress in the context window and set a very large max_tokens","Start each session with an empty context and let the model rediscover state","Disable the memory tool and use a longer system prompt that you rewrite for each session"],"a":[0],"e":"Persist progress and state in artifacts (for example progress files and version control history) so a new session can recover quickly. The memory tool docs describe a multisession pattern.","k":"multisession pattern","src":"Context windows"},{"id":"AP-10","s":"AP","t":"s","q":"Claude issues three independent tool calls in one turn. How must the results be returned?","o":["In a single user message containing all the tool_result blocks","In three separate user messages, one tool_result block per message","In a single assistant message containing all the tool_result blocks","In the system prompt of the next request, one block for each tool_use_id"],"a":[0],"e":"Parallel tool calls produce multiple tool_use blocks. Return every tool_result, matched by tool_use_id, together in one user message immediately after the assistant turn.","k":"parallel tool use","src":"Handle tool calls"},{"id":"AP-11","s":"AP","t":"s","q":"An agent has a very large tool library, and the tool definitions alone consume much of the context. Which feature defers tool definitions so they load only when needed?","o":["The tool search tool (deferred loading)","Prompt caching on the full tool definitions","The Message Batches API (async mode)","Fine-grained streaming of tool inputs"],"a":[0],"e":"The tool search tool lets Claude discover tools on demand, with definitions deferred (defer_loading) instead of all loaded upfront, reducing context use.","k":"tool search, defer_loading","src":"Context windows"},{"id":"AP-12","s":"AP","t":"s","q":"In Claude Code, what does a subagent return to the main conversation?","o":["A summary of its work, while its detailed exploration stays in its own context","Its full transcript, including every file it read and every tool call it made along the way","Nothing; it writes results to a file that the main agent has to open itself","The list of files it read and a pass or fail status for the delegated task"],"a":[0],"e":"Subagents run in an isolated context window and return a summary, keeping verbose exploration out of the main conversation.","k":"subagent","src":"Claude Code subagents"},{"id":"AP-13","s":"AP","t":"s","q":"Anthropic suggests 'poka-yoke' for tool design. Which example follows that idea?","o":["Requiring absolute file paths so the model cannot make relative-path mistakes","Letting the model pass relative paths and resolving them from the current directory","Adding a system-prompt warning that tells the model to double-check each path","Accepting any string for every parameter so the model has maximum flexibility"],"a":[0],"e":"Poka-yoke means designing arguments so mistakes are hard to make, such as requiring absolute filepaths rather than relative ones.","k":"poka-yoke, agent-computer interface","src":"Building effective agents"},{"id":"AP-14","s":"AP","t":"s","q":"Which Claude Code subagent frontmatter field limits how many agentic turns the subagent can take before it stops?","o":["maxTurns","tools","memory","isolation"],"a":[0],"e":"The optional maxTurns frontmatter field limits agentic turns. tools is an allowlist, memory enables persistent memory, isolation: worktree runs in a git worktree.","k":"maxTurns","src":"Claude Code subagents"},{"id":"AP-15","s":"AP","t":"s","q":"Which memory design best fits long-running agent work that outgrows the context window?","o":["Combine a persistent memory store with compaction or context editing, and keep the context window lean","Keep every tool output in context so the model can refer back to any earlier result","Lower the sampling temperature to 0 so the model recalls earlier facts more reliably","Raise max_tokens to the maximum and set effort high so the model can reason over the full history"],"a":[0],"e":"As token count grows accuracy and recall degrade (context rot). Curate context with compaction or context editing and persist durable facts in memory outside the window.","k":"context rot, memory","src":"Context windows"},{"id":"UR-01","s":"UR","t":"s","q":"Stakeholders write: 'The assistant should feel fast.' Which rewrite turns this into a testable requirement?","o":["The assistant should answer common questions quickly, with a short delay that users find acceptable during normal working hours.","The first token of the streamed reply appears within 1.5 seconds for 95% of requests at 200 concurrent users.","The assistant will be built on the fastest available model tier and will stream every reply so response times feel snappy to every user.","The assistant must respond faster than competing products, as judged by stakeholders after release."],"a":[1],"e":"A requirement must be specific and measurable. A latency threshold at a percentile under a stated load can be tested; vague wording and solution choices cannot.","k":"specific, measurable success criteria","src":"Define your success criteria"},{"id":"UR-02","s":"UR","t":"m","q":"Select TWO non-functional requirements for a Claude-based document assistant.","o":["The p95 time to first token is under 2 seconds.","Customer documents must be processed only in an approved region.","The user can upload a PDF and ask questions about it.","The user can rate each answer with a thumbs up or down."],"a":[0,1],"e":"Non-functional requirements describe qualities and constraints (performance, data residency, availability, security). Functional requirements describe what the system does for its users (upload, rate).","k":"functional vs non-functional requirements","src":"Requirements engineering"},{"id":"UR-03","s":"UR","t":"s","q":"A business requirement states: 'Reduce average ticket handling time by 30%.' What is the correct next step in deriving technical requirements?","o":["Select the largest available model first, then derive the functional requirements from whatever its benchmark results suggest it does well.","Decompose it into functional requirements (draft replies from the knowledge base), infrastructure requirements (ticketing system integration) and measurable acceptance criteria.","Write the system prompt first, then infer the functional requirements and acceptance criteria from how the assistant behaves on sample tickets.","Translate the 30% target directly into a latency threshold and a token budget, since technical requirements follow from the model's capabilities alone."],"a":[1],"e":"Business requirements are refined into functional and infrastructure requirements based on the solution architecture, each with acceptance criteria that show whether the business goal is met.","k":"business to functional and infrastructure requirements","src":"Requirements engineering"},{"id":"UR-04","s":"UR","t":"s","q":"A requirement says customer data must not leave a specified geography. Which first step best turns this into a solution decision?","o":["Map the data flows and verify that the chosen deployment path and its data-handling terms satisfy the residency constraint, before designing the application.","Add an instruction to the system prompt telling Claude to keep customer data inside the permitted geography, and to refuse any request that would move it elsewhere.","Lower max_tokens and truncate each response so that less customer data is generated, which keeps the data inside the permitted geography.","Enable prompt caching on the customer data so it is stored once and sent less often, which reduces how much leaves the specified geography."],"a":[0],"e":"Residency is an infrastructure and compliance constraint. It is satisfied by architecture and provider choices that you verify, not by prompt wording.","k":"infrastructure requirement, data residency","src":"Requirements engineering"},{"id":"UR-05","s":"UR","t":"s","q":"A product expects about 500 requests per minute at peak, each with a long prompt. Which API limits should be checked against that load during requirements analysis?","o":["Requests per minute plus input and output tokens per minute for the models in use","Requests per second and total tokens per day, combined across all API keys","Concurrent connections and the maximum context window of the models in use per request","Requests per hour and output tokens per day, since long prompts are billed per request"],"a":[0],"e":"Rate limits are expressed as requests per minute (RPM), input tokens per minute (ITPM) and output tokens per minute (OTPM). Long prompts can hit the token limits before the request limit.","k":"rate limits: RPM, ITPM, OTPM","src":"Rate limits"},{"id":"UR-06","s":"UR","t":"s","q":"A sponsor says: 'The assistant must never give a wrong answer.' What is the best response during requirements analysis?","o":["Accept it as a firm commitment and add instructions to the system prompt telling Claude to double-check every fact and to decline any question it is not fully certain about.","Restate it as measurable accuracy targets and define controls such as grounding on retrieved sources, output validation and human review for high-risk cases.","Escalate the requirement for removal and ask the sponsor to drop the accuracy goal, since language models are too unreliable for production use.","Set temperature to 0, add a self-check step that asks Claude to confirm its own answer, and record the requirement as met once tests pass."],"a":[1],"e":"LLM output is probabilistic and can be confidently wrong. Requirements should state acceptable error rates and the mitigations used. Temperature 0 does not guarantee correctness.","k":"skepticism toward confident output","src":"Define your success criteria"},{"id":"UR-07","s":"UR","t":"s","q":"A workflow can issue refunds. Compliance requires a person to approve any refund above a threshold. How should this requirement be satisfied?","o":["With an approval step in the tool-execution path, before the refund tool runs","By instructing Claude in the system prompt to ask the user for permission above the limit","By setting tool_choice to auto so Claude decides when a refund needs approval","By adding a refund-policy section to the knowledge base that Claude retrieves per request"],"a":[0],"e":"A control requirement is enforced in code at the point where the action executes (an approval pattern or a hook), not left to model judgment.","k":"approval pattern","src":"Requirements engineering"},{"id":"UR-08","s":"UR","t":"s","q":"Which requirement most directly implies using streaming?","o":["Users should see the reply appear progressively so perceived latency is low.","Documents are processed overnight in bulk at the lowest possible cost.","A long, stable system prompt should be reused across requests to cut input cost.","Output must conform to a fixed JSON schema that downstream code parses without repair."],"a":[0],"e":"Streaming (server-sent events) delivers tokens as they are generated, which improves perceived latency in interactive interfaces. The other requirements point to batch, prompt caching and structured outputs.","k":"streaming requirement","src":"Streaming messages"},{"id":"UR-09","s":"UR","t":"m","q":"Select TWO items that belong in the acceptance criteria for a Claude-powered classifier, defined before it is built.","o":["A labeled test set including edge cases, with a target metric such as accuracy or F1","Targets for latency and cost per request","The final wording and ordering of every few-shot example in the prompt","The parameter count and training data cutoff of the chosen model"],"a":[0,1],"e":"Success criteria should be specific and measurable and cover task fidelity, latency and cost. The prompt wording is an implementation detail that evolves against those criteria.","k":"success criteria, evaluation design","src":"Define your success criteria"},{"id":"UR-10","s":"UR","t":"s","q":"The expected input of an app is about 400,000 tokens per request. Which design input is most relevant?","o":["Whether the selected model's context window and maximum output can accommodate the input and the answer, or whether chunking or another strategy is needed","Whether the sampling temperature is low enough to keep very long responses consistent, and whether top_p should be reduced alongside it","Whether the CLAUDE.md hierarchy is deep enough to load the project instructions together with the full input document","Whether the number of configured hooks is small enough that each request completes before the API timeout expires and returns an answer"],"a":[0],"e":"Input larger than the model's context window is rejected with a 400 error ('prompt is too long'). Capacity must be checked against the requirements.","k":"context window requirement","src":"Context windows"},{"id":"SL-01","s":"SL","t":"s","q":"Which sequence lists the classic systems development life cycle phases in order?","o":["Requirements, design, implementation, testing, deployment, maintenance","Design, deployment, requirements, testing, implementation, maintenance","Implementation, requirements, maintenance, testing, design, deployment","Testing, requirements, design, deployment, implementation, maintenance"],"a":[0],"e":"The classic SDLC runs from requirements through design, implementation, testing and deployment to operation and maintenance.","k":"SDLC phases","src":"Systems life cycle"},{"id":"SL-02","s":"SL","t":"s","q":"A vendor retires the model your application calls. You change the model identifier and re-run the regression tests. Which kind of software maintenance is this?","o":["Adaptive maintenance","Corrective maintenance","Perfective maintenance","Preventive maintenance"],"a":[0],"e":"Adaptive maintenance keeps software working after a change in its environment, such as a retired model or API change. Corrective fixes faults, perfective improves features or performance, preventive reduces future risk.","k":"adaptive maintenance","src":"Systems life cycle"},{"id":"SL-03","s":"SL","t":"s","q":"Why do iterative approaches suit prompt-driven features better than a single up-front design phase?","o":["Prompt behavior is validated empirically on real inputs, so short cycles of build, evaluate and refine reduce risk.","Prompt wording can be fully specified in advance, so a single design phase is cheaper than repeated evaluation.","Agile methods defer testing until the final sprint, so a prompt is judged after the whole feature is released.","The model is fine-tuned every sprint on the team's latest prompts, so each short iteration produces a measurably better model."],"a":[0],"e":"Because model output depends on real inputs, quality is established by evaluation. Short iterations with an eval set let the team refine prompts and catch regressions early.","k":"iterative development","src":"Develop your test cases"},{"id":"SL-04","s":"SL","t":"s","q":"A team changes a system prompt. Which CI/CD practice best protects production quality?","o":["Run the automated eval suite on every prompt change and block the merge if scores regress.","Deploy the change straight to production and watch support tickets for the first week to spot regressions.","Ask the model whether the new prompt seems better and merge the change if it agrees.","Run the existing unit tests for the application code and skip evals, since prompt text is not code."],"a":[0],"e":"Prompts are versioned artifacts that change behavior. Automated evaluations in the pipeline act as regression tests for them.","k":"CI/CD, eval gate","src":"Develop your test cases"},{"id":"SL-05","s":"SL","t":"s","q":"Which deployment strategy best limits the impact of a faulty new model or prompt version?","o":["A canary or staged rollout to a small share of traffic, with monitoring and a rollback path","A full cutover of all traffic to the new version at once, with the old version deleted afterward","A production load test with synthetic traffic, followed by a full release","A manual review by one developer before releasing, with no monitoring or rollback once it is live"],"a":[0],"e":"Staged rollouts expose a change to a small share of users first, so problems are caught before full release and can be rolled back.","k":"canary release, rollback","src":"Systems life cycle"},{"id":"SL-06","s":"SL","t":"m","q":"Select TWO signals an operations team should monitor for a production Claude application.","o":["Error rates by status code and latency percentiles","Token usage and cost trends from the usage object","Code coverage percentage of the unit test suite","Average pull request review time per sprint"],"a":[0,1],"e":"Operating an LLM application means tracking reliability (errors, latency) and consumption (tokens and cost per request).","k":"operate and monitor","src":"Systems life cycle"},{"id":"SL-07","s":"SL","t":"s","q":"Why use separate workspaces and API keys for development, staging and production?","o":["To isolate usage tracking, limits, access control and the impact of a leaked key for each environment","Because each model is licensed to one workspace at a time, so each environment needs its own model","Because streaming and prompt caching are enabled per workspace and are disabled by default in development","Because workspaces give each environment its own pricing tier, so development requests are billed at a lower rate"],"a":[0],"e":"Environment separation limits blast radius and lets you set limits, permissions and monitoring per environment.","k":"workspaces, environment separation","src":"Workspaces"},{"id":"SL-08","s":"SL","t":"s","q":"Which activity belongs to the operate-and-maintain stage of a Claude application's life cycle?","o":["Reviewing logs and request IDs for failures, tracking cost, and updating prompts and model versions under change control","Writing the initial business case, estimating the budget and getting sponsor approval for the project","Choosing the programming language, the SDK and the deployment platform for the first release","Drafting the first user stories, defining the acceptance criteria, agreeing the scope with sponsors and ranking features by value"],"a":[0],"e":"After release the system is operated: monitored, tuned and updated through controlled changes.","k":"operate and maintain","src":"Systems life cycle"},{"id":"API-01","s":"API","t":"s","q":"The Messages API is stateless. How does an application continue a multi-turn conversation?","o":["Send the full relevant conversation history in the messages array on every request.","Send just the newest user message; the server keeps earlier turns for the session.","Pass the conversation_id returned by the first response in each follow-up request.","Store the history once in the system parameter and omit earlier turns from messages."],"a":[0],"e":"The API keeps no conversation state. The client resends the prior turns, alternating user and assistant, with each new request.","k":"stateless Messages API","src":"Messages API"},{"id":"API-02","s":"API","t":"s","q":"Where does the system prompt go in a standard Messages API request?","o":["In the top-level system parameter","As the first entry of messages, with the role 'developer'","In the system request header","In the top-level instructions parameter"],"a":[0],"e":"The system prompt is supplied through the top-level system parameter, separate from the user and assistant turns in messages. Newer models also accept role 'system' messages in messages, but only for instructions added mid-conversation; the system prompt itself belongs in the top-level system parameter.","k":"system parameter","src":"Messages API"},{"id":"API-03","s":"API","t":"s","q":"Besides model and messages, which parameter is required in every Messages API request?","o":["max_tokens","temperature","tool_choice","metadata"],"a":[0],"e":"max_tokens is required. It caps the number of tokens generated, and with thinking enabled it also bounds the thinking tokens.","k":"max_tokens","src":"Messages API"},{"id":"API-04","s":"API","t":"s","q":"A response ends with stop_reason max_tokens. What does this mean?","o":["Generation was cut off at the max_tokens limit, so the output may be incomplete.","The model reached a natural end of its turn, so the output is complete.","The model paused to request a tool call, so the client must run it and reply.","The input exceeded the model's context window, so the request was rejected before generation."],"a":[0],"e":"max_tokens means the output was truncated by the limit. Handle it, for example by raising the limit or continuing the generation.","k":"stop_reason: max_tokens","src":"Handling stop reasons"},{"id":"API-05","s":"API","t":"s","q":"Which transport does Claude API streaming use?","o":["Server-sent events (SSE), enabled with stream: true","WebSocket frames, enabled with stream: true","gRPC bidirectional streaming over HTTP/2 channels","Long polling with request IDs, enabled with poll: true"],"a":[0],"e":"Setting stream to true makes the API return incremental events over server-sent events.","k":"server-sent events","src":"Streaming messages"},{"id":"API-06","s":"API","t":"s","q":"Which is the correct order of events in a streamed text response?","o":["message_start, content_block_start, content_block_delta (repeated), content_block_stop, message_delta, message_stop","message_start, content_block_start, content_block_delta (repeated), message_delta, content_block_stop, message_stop","message_start, message_delta, content_block_start, content_block_delta (repeated), content_block_stop, message_delta, message_stop","message_start, content_block_start, content_block_stop, content_block_delta (repeated), message_delta, message_stop"],"a":[0],"e":"A stream opens with message_start, then one or more content blocks (start, deltas, stop), then message_delta (stop_reason and usage) and message_stop. ping events may appear anywhere.","k":"streaming event flow","src":"Streaming messages"},{"id":"API-07","s":"API","t":"s","q":"In a streamed response, which event carries the final stop_reason and the cumulative usage?","o":["message_delta","message_start","message_stop","usage_delta"],"a":[0],"e":"message_delta reports top-level changes to the message, including stop_reason and usage.","k":"message_delta","src":"Streaming messages"},{"id":"API-08","s":"API","t":"s","q":"During streaming, tool input arrives as input_json_delta events carrying partial_json. How should the client handle them?","o":["Concatenate the fragments and parse the JSON when the content block stops.","Parse each partial_json fragment as it arrives and execute the tool on the first valid one.","Append each fragment to the text block shown to the user.","Discard them, since tool inputs are delivered whole in the content_block_start event."],"a":[0],"e":"The deltas are fragments of a JSON string. Accumulate them and parse only after content_block_stop.","k":"input_json_delta, partial_json","src":"Streaming messages"},{"id":"API-09","s":"API","t":"s","q":"A stream returns HTTP 200 and later an error event of type overloaded_error. What does this show?","o":["Errors can arrive inside the stream after the HTTP status was sent, so stream consumers must handle error events.","The HTTP 200 status guarantees the generation will complete, so an overloaded_error event can be safely ignored by consumers.","The API key lacks permission for streaming, so the server closed the stream with an error event.","The SDK retries the request on overloaded_error events, so application code needs no stream error handling."],"a":[0],"e":"Because the 200 status is sent before generation completes, failures such as overloaded_error can appear as events within the stream.","k":"error event in stream","src":"Streaming messages"},{"id":"API-10","s":"API","t":"s","q":"A request is expected to run longer than 10 minutes and the SDK refuses a non-streaming call. What is the recommended approach?","o":["Use streaming (for example with the SDK's final-message helper) or the Message Batches API.","Keep the non-streaming call and override the SDK timeout so the check no longer blocks it","Switch to a larger model tier so that the request finishes faster than 10 minutes.","Send the call through the Files API so the upload time no longer counts toward the 10 minute limit."],"a":[0],"e":"SDKs reject non-streaming requests expected to exceed 10 minutes. Streaming, or batch for latency-tolerant work, avoids the long-lived idle connection. Overriding the timeout silences the guard but still risks dropped idle connections.","k":"streaming for long requests","src":"Streaming messages"},{"id":"API-11","s":"API","t":"s","q":"Which statement about the Message Batches API is correct?","o":["It gives a 50% discount, processes requests asynchronously, and unfinished requests expire after 24 hours.","It gives a 25% discount, processes requests asynchronously, and unfinished requests expire after 7 days.","It gives a 50% discount, returns results synchronously, and unfinished requests expire after 24 hours.","It gives a 50% discount, processes requests asynchronously, and unfinished requests expire after 1 hour."],"a":[0],"e":"Batches are priced at 50% of standard prices. Most finish in under an hour, and a batch expires if not completed within 24 hours.","k":"Message Batches API","src":"Batch processing"},{"id":"API-12","s":"API","t":"s","q":"How do you match each batch result to the request that produced it?","o":["Use the custom_id you assigned to each request.","Rely on the result order matching the request order.","Use the request-id header of each result line.","Match each result on its prompt text and model name."],"a":[0],"e":"Each request in a batch has a unique custom_id. Results can come back in any order, so match by custom_id.","k":"custom_id","src":"Batch processing"},{"id":"API-13","s":"API","t":"m","q":"A batch has ended. Select THREE per-request result types that are not billed.","o":["succeeded","errored","canceled","expired"],"a":[1,2,3],"e":"Results are succeeded, errored, canceled or expired. You are billed only for succeeded requests.","k":"batch result types","src":"Batch processing"},{"id":"API-14","s":"API","t":"s","q":"How do you retrieve batch results?","o":["Poll the batch until processing_status is ended, then read the JSONL results from results_url.","Read the JSONL results from the create call's response body, which streams them as they finish.","Call the Messages API with the batch id and the custom_id of each request to fetch its reply.","Poll the batch until its status is succeeded, then read the JSON array of results from output_url."],"a":[0],"e":"A batch moves from in_progress to ended. Results are then available as a JSONL file through results_url.","k":"processing_status, results_url","src":"Batch processing"},{"id":"API-15","s":"API","t":"s","q":"Which workload is best suited to the Batches API rather than real-time Messages calls?","o":["Nightly classification of 200,000 archived tickets needed by next morning","A customer-facing chat widget answering questions during business hours","Inline autocomplete suggestions inside a developer's IDE as they type","A voice assistant that must answer within a second of the caller finishing a sentence"],"a":[0],"e":"Batch trades latency for cost: it suits large, non-urgent jobs. Interactive features need real-time calls.","k":"realtime vs batch","src":"Batch processing"},{"id":"API-16","s":"API","t":"s","q":"To cache a long, stable prefix, what do you add to the request, and what order defines the prefix?","o":["A cache_control {type: ephemeral} marker on a content block; the prefix order is tools, then system, then messages.","A cache_ttl parameter at the top level of the request; the prefix order is messages, then system, then tools.","A cache-key header on the HTTP request; the prefix order is system, then tools, then messages.","A cache_control {type: persistent} marker on a content block; the prefix order is system, then messages, then tools."],"a":[0],"e":"Prompt caching uses cache_control with type ephemeral. The cached prefix is built in the order tools, system, messages. A top-level cache_control field (automatic caching) is also supported; a TTL, if set, goes inside cache_control.","k":"cache_control, prefix order","src":"Prompt caching"},{"id":"API-17","s":"API","t":"m","q":"Repeated long requests that are meant to share a cached prefix show cache_creation_input_tokens and cache_read_input_tokens both at 0 although cache_control is set. Select TWO plausible causes.","o":["The cached prefix is shorter than the model's minimum cacheable length.","Something in the prefix changes between requests, so there is no exact match.","The request was sent through the streaming endpoint with stream set to true.","The request sets max_tokens below the size of the cached prefix."],"a":[0,1],"e":"Caching needs a prefix at least as long as the model's minimum cacheable length and an exact match of the prefix. Streaming and max_tokens do not disable caching.","k":"cache usage fields","src":"Prompt caching"},{"id":"API-18","s":"API","t":"s","q":"How do you send an image to Claude through the Messages API?","o":["As an image content block in a user message, with a source such as base64 data or a URL","As a top-level images array next to messages, with base64 data or a URL","As an image content block in the system parameter, with a source such as base64 data or a URL","As an image attachment in the metadata field, referenced by a file name in the user message"],"a":[0],"e":"Vision input is provided as image content blocks inside a user message.","k":"image content block","src":"Vision"},{"id":"API-19","s":"API","t":"s","q":"When thinking is enabled and Claude uses tools, what must you do with thinking blocks when returning tool results?","o":["Pass them back unmodified, including the signature, in the assistant turn.","Strip them out of the assistant turn to save tokens, keeping just the tool_use blocks.","Replace them with a short summary you write, keeping the signature field attached to it.","Pass them back as text blocks in the user turn with the tool_result."],"a":[0],"e":"Thinking blocks and their signatures must be returned unmodified for the model to continue its reasoning; altering them produces an error.","k":"thinking blocks, signature","src":"Thinking"},{"id":"API-20","s":"API","t":"s","q":"A company must call Claude through its existing cloud provider contract. Which statement is correct?","o":["Claude is available through third-party platforms such as Amazon Bedrock and Google Cloud (Agent Platform, formerly Vertex AI), where model identifiers and feature availability can differ from the first-party API, so check each platform's documentation.","Claude is available on cloud platforms such as Amazon Bedrock and Google Cloud (Agent Platform, formerly Vertex AI), where model identifiers and beta features match the first-party API on release day, so no check is needed.","Claude is available through a cloud provider contract by routing first-party API keys through the provider's gateway, which keeps pricing, rate limits and quotas identical to the Claude API.","Claude is not offered on cloud provider platforms; Amazon Bedrock and Google Cloud (Agent Platform, formerly Vertex AI) host other vendors' models, so the contract must be replaced with a direct Anthropic account."],"a":[0],"e":"The SDKs provide clients for the cloud platforms, but identifiers, regions and feature support are platform specific. Microsoft Foundry is also available as a platform.","k":"third-party platforms","src":"Claude on cloud platforms"},{"id":"API-21","s":"API","t":"s","q":"Which approach uploads a large document once and reuses it across several requests without resending its bytes?","o":["The Files API: upload once and reference the file_id","Prompt caching: resend the base64 data with cache_control","The Batches API: upload once and reference the custom_id","Citations: upload once, cite the document_index"],"a":[0],"e":"The Files API stores an uploaded file so later requests reference it by file_id rather than resending the content.","k":"Files API","src":"Files API"},{"id":"SEF-01","s":"SEF","t":"s","q":"You call the Messages API with plain HTTP instead of an SDK. Which request shape is correct?","o":["POST to /v1/messages with the x-api-key, anthropic-version and content-type: application/json headers","GET to /v1/messages with the x-api-key and anthropic-version values passed as URL query parameters","PUT to /v1/messages with the x-api-key, anthropic-version and content-type: application/json headers","POST to /v1/messages with an API key header and content-type: application/json, but without an anthropic-version header"],"a":[0],"e":"The Messages API is a REST endpoint taking a JSON POST body. The API key goes in the Authorization: Bearer header (the legacy x-api-key header is still supported), and the anthropic-version and content-type headers are required.","k":"REST, x-api-key, anthropic-version","src":"API overview"},{"id":"SEF-02","s":"SEF","t":"m","q":"Select TWO failures that are appropriate for automatic retry with exponential backoff and jitter.","o":["429 rate_limit_error","529 overloaded_error or a 5xx error","400 invalid_request_error","401 authentication_error"],"a":[0,1],"e":"Rate limits and transient server or overload errors can succeed on retry. 400 and 401 are caused by the request or credentials and will fail again until fixed. The SDKs retry transient errors twice by default.","k":"retryable errors, backoff","src":"Errors"},{"id":"SEF-03","s":"SEF","t":"s","q":"A tool that issues a refund times out, and the application retries the call. What design feature prevents a double refund?","o":["An idempotency key (or a check for an existing refund) used by the downstream system","A system prompt rule telling Claude to call the refund tool once per conversation","A lower temperature on the refund request so that Claude issues the same tool call each time","A longer client timeout, so the refund call has time to finish before the application retries"],"a":[0],"e":"Retries can repeat side effects. Make state-changing operations idempotent so the same request has the same effect when applied twice.","k":"idempotency","src":"Software engineering practice"},{"id":"SEF-04","s":"SEF","t":"s","q":"An application expects JSON in Claude's text output. Which handling is most robust?","o":["Parse inside a try/catch, validate against a schema, and retry, repair or fall back when parsing or validation fails","Pass the text to eval() inside a try/catch and trust any object that evaluates without error","Parse once with JSON.parse and trust the result without a schema check, because the system prompt already instructs Claude to return valid JSON","Extract fields with a regular expression and silently skip any reply that does not match the pattern"],"a":[0],"e":"Treat model output as untrusted data: parse defensively, validate its structure and have a recovery path. Never execute it.","k":"defensive parsing","src":"Structured outputs"},{"id":"SEF-05","s":"SEF","t":"s","q":"Which JSON Schema setting rejects objects that contain properties you did not define?","o":["additionalProperties: false","additionalItems: false","additionalProperties: true","required: [all property names]"],"a":[0],"e":"additionalProperties: false forbids undeclared properties. Structured outputs and strict tool use support only false for objects (any other value returns a 400), and SDK schema helpers add it automatically.","k":"JSON Schema, additionalProperties","src":"Structured outputs"},{"id":"SEF-06","s":"SEF","t":"s","q":"A script must call Claude for 5,000 independent documents. Which approach improves throughput while respecting rate limits?","o":["Bounded concurrency (a worker pool or semaphore) with retries and backoff on 429 responses","Sequential calls with a fixed one-second pause after each reply and no retry logic of any kind","Launching all 5,000 requests at once with a high client timeout, and retrying failures immediately","Unbounded concurrency (a thread per document) with retries on every 4xx and 5xx response"],"a":[0],"e":"Concurrency improves throughput; bounding it and backing off keeps you inside rate limits. If results are not urgent, the Batches API is the cheaper alternative.","k":"asynchronous programming, concurrency","src":"Rate limits"},{"id":"SEF-07","s":"SEF","t":"s","q":"An asyncio web service calls the synchronous Claude client inside request handlers, and the whole service stalls under load. What is the fix?","o":["Use the SDK's async client and await the calls","Raise the model's temperature to shorten each call","Call time.sleep between requests to spread the load","Disable streaming for the whole service"],"a":[0],"e":"A synchronous call blocks the event loop. The Python SDK provides an asynchronous client for use with await.","k":"AsyncAnthropic","src":"Python SDK"},{"id":"SEF-08","s":"SEF","t":"s","q":"Two parallel tool calls append to the same shared list without synchronization, and results are sometimes lost. What is the best fix?","o":["Avoid shared mutable state, or protect it with a lock or a thread-safe structure","Instruct Claude in the system prompt to order its tool calls so that the writes do not overlap","Retry the whole conversation turn when a result is missing from the list","Switch to a faster model so each tool call completes before the next one starts"],"a":[0],"e":"This is a race condition in the application code. Fix it with proper concurrency control or by avoiding shared mutable state.","k"
