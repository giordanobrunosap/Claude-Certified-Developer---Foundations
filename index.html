:"race condition","src":"Software engineering practice"},{"id":"SEF-09","s":"SEF","t":"s","q":"Which design best prevents a retry storm during a provider outage?","o":["Bounded retries with exponential backoff and jitter, plus a circuit breaker or fallback","Unlimited retries with a fixed 100 ms delay, plus a larger client timeout for each call","Bounded retries with a fixed one-second delay, sent in parallel from all workers at once","Removing client timeouts so each call waits for the provider to recover, with retries on failure"],"a":[0],"e":"Unbounded or synchronized retries amplify an outage. Backoff, jitter, limits and circuit breakers keep load under control.","k":"backoff with jitter, circuit breaker","src":"Errors"},{"id":"SEF-10","s":"SEF","t":"s","q":"Where should system prompts and prompt templates live in a production code base?","o":["In version control next to the code, changed through reviewed pull requests with eval results","In a shared wiki page that engineers copy into the code after the team lead approves the wording","In the Console workbench, edited directly by whoever has access, with history kept outside the repository","In environment variables on the production server, changed by operators without a review step"],"a":[0],"e":"Prompts change behavior, so they are versioned, reviewed and tested like code.","k":"version control for prompts","src":"Software engineering practice"},{"id":"SEF-11","s":"SEF","t":"s","q":"An API key was committed to a Git repository. What should be done first?","o":["Revoke or rotate the key, then clean up the history and add secret scanning","Delete the file in a new commit, then rotate the key after the next release","Make the repository private and rewrite history, leaving the key active until the audit ends","Add the key file to .gitignore and rotate it at the next scheduled credential review"],"a":[0],"e":"A key in history must be treated as compromised. Rotate first, because removing it from the latest commit does not remove it from history or from clones.","k":"secret in version control","src":"API key best practices"},{"id":"SEF-12","s":"SEF","t":"s","q":"A faulty commit is already pushed to a shared branch. Which approach undoes it without rewriting shared history?","o":["git revert, which creates a new commit that reverses the change","git reset --hard, then a force push to the shared branch","git rebase -i to drop the commit, then push with --force-with-lease","git commit --amend, which replaces the faulty commit with a corrected one"],"a":[0],"e":"On shared branches, revert adds a new commit. Rewriting published history forces everyone else to reconcile.","k":"git revert","src":"Version control"},{"id":"SEF-13","s":"SEF","t":"s","q":"How should code written by Claude be treated in code review?","o":["Like any other contribution: review it, test it, and check for incorrect or invented APIs and security issues","As pre-reviewed work: the model has already validated its API calls, so reviewers can focus on style, naming and formatting","As trusted output: tests are optional because the model verified its own logic while writing","With a lighter process: check that it compiles and passes linting, then merge without line review"],"a":[0],"e":"Model-generated code can be plausible but wrong. Reviews and automated tests apply fully.","k":"code review","src":"Software engineering practice"},{"id":"SEF-14","s":"SEF","t":"m","q":"Select THREE items to check when reviewing a pull request that integrates Claude into an application.","o":["Handling of stop_reason values such as max_tokens and tool_use","Separation of untrusted content from instructions","Retry and error handling with bounded backoff","Whether the model was trained on the team's private repository"],"a":[0,1,2],"e":"A review should cover correct response handling, prompt-injection exposure and resilience. Whether the model was trained on the team's private repository is not a code-review item.","k":"review checklist","src":"Software engineering practice"},{"id":"SEF-15","s":"SEF","t":"s","q":"Which Claude Code flag runs a prompt non-interactively, prints the result and exits, which suits a CI job?","o":["-p (print mode)","--resume session","-c (continue)","--watch (CI mode)"],"a":[0],"e":"claude -p runs headless. Add --output-format json or stream-json for machine-readable output. Anthropic recommends --bare for scripted calls such as CI.","k":"claude -p, headless","src":"Claude Code headless"},{"id":"SEF-16","s":"SEF","t":"s","q":"A CI job runs Claude Code on every pull request. Which configuration best follows least privilege?","o":["Restrict the job to the read and search tools it needs (with --tools, or --allowedTools plus --permission-mode dontAsk) and do not use bypass modes","Run with --dangerously-skip-permissions so the job does not stall waiting for approval on any tool","Allow all tools through --allowedTools and add the production database credentials so it can verify fixes against real data","Allow every built-in tool and rely on a reviewer to approve each action in the terminal during the run"],"a":[0],"e":"Headless runs have no human to approve actions. --allowedTools only pre-approves tools; use --tools or dontAsk mode to actually limit what can run, and avoid bypassPermissions.","k":"--allowedTools, least privilege","src":"Claude Code headless"},{"id":"SEF-17","s":"SEF","t":"s","q":"Which statement defines refactoring?","o":["Changing the internal structure of code without changing its external behavior","Changing the external behavior of code to add features while its structure stays intact","Rewriting the code in another language to improve its performance, with the same tests passing","Fixing defects so that the code's behavior matches the original specification"],"a":[0],"e":"Refactoring improves structure while preserving behavior, which is why tests are the safety net.","k":"refactoring","src":"Software engineering practice"},{"id":"SEF-18","s":"SEF","t":"s","q":"A legacy module has no tests, and you will refactor it with Claude Code. What should come first?","o":["Write characterization tests that capture current behavior","Refactor first, then write tests that describe the new behavior","Rewrite the module from scratch and compare it with the old one by eye","Ask Claude to document the old behavior in code comments"],"a":[0],"e":"Characterization tests pin down existing behavior so the refactor can be verified.","k":"characterization tests","src":"Software engineering practice"},{"id":"SEF-19","s":"SEF","t":"s","q":"Which approach best reduces the risk of a large-scale migration of a monolith?","o":["Incremental migration (for example the strangler pattern) with feature flags and tests at each step","A big-bang rewrite in a parallel code base, released once it reaches feature parity with the monolith","A code freeze on the monolith while a dedicated team rebuilds it, with one test at the end","Migrating the data layer first in a single release, then moving the services over without feature flags"],"a":[0],"e":"Incremental changes keep the system working, give early feedback and allow rollback.","k":"strangler pattern, incremental migration","src":"Software engineering practice"},{"id":"SEF-20","s":"SEF","t":"s","q":"Which workflow is best when using Claude Code for a large refactor across hundreds of files?","o":["Plan the change, split it into small verifiable steps, run tests after each step and commit checkpoints","Issue a single detailed prompt that rewrites every file, then run the tests once and commit the result","Let Claude edit files freely, skip the plan and run the test suite once at the end of the refactor","Merge the affected modules into one file first so Claude can see the whole change in a single context"],"a":[0],"e":"Small steps with checkpoints keep each change reviewable and recoverable, and tests catch regressions early. Subagents can explore in parallel without bloating the main context.","k":"large-scale refactoring","src":"Claude Code best practices"},{"id":"SEF-21","s":"SEF","t":"s","q":"Which structure best separates concerns in an application that calls Claude?","o":["Separate modules for prompt templates, the API client wrapper, response parsing and validation, and business logic","One module that builds the prompt, calls the API, parses the reply and applies the business rules","Prompt strings embedded in UI components, with the API call and response parsing in the same handler","Business rules written into the system prompt, with thin modules that just forward requests and responses unchanged to the API"],"a":[0],"e":"Separation of concerns makes each part testable and replaceable, for example changing a model or a prompt without touching business rules.","k":"separation of concerns","src":"Software engineering practice"},{"id":"SEF-22","s":"SEF","t":"s","q":"Why commit a lockfile for an application that depends on the Claude SDK?","o":["To reproduce the same dependency versions in every environment, and upgrade them deliberately with tests","To store encrypted API keys and other secrets alongside the dependency list for each environment","To raise rate limits by pinning the SDK to a release that includes the higher tier's quotas","To let the SDK pick up newer model identifiers and features automatically at each deployment"],"a":[0],"e":"A lockfile pins resolved versions so builds are reproducible; upgrades become explicit and reviewable.","k":"dependency pinning","src":"Software engineering practice"},{"id":"CAD-01","s":"CAD","t":"s","q":"A prompt works well in claude.ai but behaves differently when sent through the API. Which is a likely reason?","o":["claude.ai adds its own system prompt, tools and features, while an API call contains only what you send.","The API applies a hidden default system prompt of its own, while claude.ai sends your text to the model untouched.","The API drops the system parameter unless a beta header is set, so role instructions do not reach the model.","The API enforces a stricter content filter that rewrites your text before the model sees it, unlike claude.ai."],"a":[0],"e":"Each interface wraps the model differently. In the API and SDKs, the instructions, tools and context are exactly what your request contains.","k":"interfaces: claude.ai vs API","src":"System prompts"},{"id":"CAD-02","s":"CAD","t":"s","q":"A team rule in CLAUDE.md ('never edit files under /migrations') is occasionally ignored by Claude Code. Which change guarantees enforcement?","o":["A PreToolUse hook or a permissions.deny rule that blocks the edit","A permissions.allow entry that lists the /migrations folder","A PostToolUse hook that logs the edit after it happens","A second copy of the rule in the user-level ~/.claude/CLAUDE.md file"],"a":[0],"e":"CLAUDE.md is delivered as context, not enforcement. Deterministic enforcement comes from hooks or permission rules.","k":"CLAUDE.md is context, hooks enforce","src":"Claude Code memory"},{"id":"CAD-03","s":"CAD","t":"s","q":"Where should persistent role and behavior rules go, and where should per-request data go?","o":["Rules in the system prompt; per-request data in the user turn","Rules in the assistant turn; per-request data in the user turn","Rules in the user turn; per-request data in the system prompt","Rules in the metadata field; per-request data in the user turn"],"a":[0],"e":"The system prompt sets role and standing behavior. Task-specific content and data go in the user turn.","k":"system vs user placement","src":"Prompting best practices"},{"id":"CAD-04","s":"CAD","t":"s","q":"A prompt includes several long documents and a question. Which layout does Anthropic recommend?","o":["Documents at the top, the question and instructions at the end","The question and instructions first, then the documents below","Documents in the system prompt, with the question in a prefill","The question placed between two halves of the documents"],"a":[0],"e":"Place long-form data at the top of the prompt and the query at the end. This improves response quality on long inputs.","k":"long documents at top","src":"Prompting best practices"},{"id":"CAD-05","s":"CAD","t":"s","q":"Which structure best marks the boundary between your instructions and supplied reference material?","o":["Wrap each item in XML tags such as <document> with a <source>, and keep instructions outside them","Place the material and instructions in one paragraph, with a blank line marking each document boundary","Put the material in the system prompt and the instructions in the first user message of the conversation","Separate each document with a line of dashes and a heading, and put the instructions between the documents"],"a":[0],"e":"XML tags let Claude parse instructions, documents and metadata unambiguously, and make it easy to refer to them by name.","k":"XML tags, document, source","src":"Prompting best practices"},{"id":"CAD-06","s":"CAD","t":"m","q":"Select TWO JSON Schema features that are not supported by structured outputs.","o":["Recursive schemas","minLength and maxLength on strings","enum values on string fields","required properties on objects"],"a":[0,1],"e":"Structured outputs do not support recursion, numeric minimum or maximum, string length constraints, or additionalProperties other than false. enum and required are supported.","k":"unsupported schema features","src":"Structured outputs"},{"id":"CAD-07","s":"CAD","t":"s","q":"Which values are the documented limits for strict tool schemas in a single request?","o":["Up to 20 strict tools, 24 optional parameters and 16 union-typed parameters","Up to 5 strict tools, 10 optional parameters and 4 union-typed parameters","Up to 100 strict tools, 50 optional parameters and 32 union-typed parameters","Up to 40 strict tools, 32 optional parameters and 8 union-typed parameters"],"a":[0],"e":"Strict tool use and structured outputs compile your schema to a grammar, which is why complexity limits apply.","k":"strict tool limits","src":"Structured outputs"},{"id":"CAD-08","s":"CAD","t":"s","q":"You design a schema that must label a ticket as one of five categories. Which design is best?","o":["An enum of the five values with a description for the field","A free-text string field checked with a regex afterwards","A number from 1 to 5 with no description of what each means","An array of free-form strings that may hold several labels"],"a":[0],"e":"Closed value sets belong in enums. Field descriptions tell the model what each field means and improve consistency.","k":"schema design, enum","src":"Structured outputs"},{"id":"CAD-09","s":"CAD","t":"s","q":"Which feature constrains the shape of Claude's final answer, and which constrains the arguments of a tool call?","o":["Structured outputs (output_config.format with json_schema) for the answer; strict: true for tool arguments","strict: true on the response for the answer; output_config.format with json_schema for tool arguments","tool_choice with type: any for the answer; stop_sequences and max_tokens for tool arguments","temperature set to 0 for the answer; a detailed tool description for tool arguments"],"a":[0],"e":"Structured outputs apply a JSON schema to the response. Strict tool use applies grammar-constrained sampling to tool inputs. They can be used together.","k":"structured outputs, strict tool use","src":"Structured outputs"},{"id":"CAD-10","s":"CAD","t":"s","q":"When can a structured-outputs response still fail to match the schema?","o":["When the stop_reason is refusal or max_tokens","When temperature is set above 0.7 on the call","When the schema nests objects two levels deep","When the response is streamed rather than buffered"],"a":[0],"e":"Schema conformance holds for completed responses. A refusal or a truncation at max_tokens can leave non-conforming output, so check stop_reason.","k":"structured output exceptions","src":"Structured outputs"},{"id":"CAD-11","s":"CAD","t":"s","q":"What does the SDK helper messages.parse (with Pydantic or Zod) provide?","o":["It sends your schema as the output format and returns a validated, typed object","It caches the schema server-side and reuses the earlier response for repeated calls","It converts your model class into a tool definition and runs the tool call locally","It retries the request until the output passes your regex, then returns the raw text"],"a":[0],"e":"The parse helpers translate a Pydantic or Zod model into a JSON schema and validate the result into typed data.","k":"messages.parse","src":"Structured outputs"},{"id":"CAD-12","s":"CAD","t":"s","q":"A long Claude Code session mixes several unrelated tasks, and answers get worse. Which habit addresses this?","o":["Run /clear when switching to an unrelated task so stale context is removed","Keep everything in one session so Claude accumulates context about all your tasks","Run /init again before each new task to refresh the conversation context","Switch to a larger model mid-session so it can hold more of the stale context"],"a":[0],"e":"Irrelevant context dilutes attention and contributes to context rot. Reset the session between unrelated tasks.","k":"session hygiene, /clear","src":"Claude Code best practices"},{"id":"CAD-13","s":"CAD","t":"s","q":"What is the difference between /compact and /clear in Claude Code?","o":["/compact summarizes the conversation to free space and continues; /clear empties the context.","/compact empties the context and starts over; /clear summarizes the conversation and continues.","/compact deletes CLAUDE.md to save space; /clear removes the oldest turns and keeps the rest.","They are aliases; /compact is the newer name and /clear is kept for backward compatibility."],"a":[0],"e":"Use /compact to keep the thread of work with less context, and /clear to start fresh.","k":"/compact, /clear","src":"Claude Code commands"},{"id":"CAD-14","s":"CAD","t":"s","q":"Which Claude Code command shows what is currently consuming the context window?","o":["/context","/config","/doctor","/export"],"a":[0],"e":"/context visualizes context usage, including memory files, so you can find what to trim.","k":"/context","src":"Claude Code commands"},{"id":"CAD-15","s":"CAD","t":"s","q":"You have corrected Claude twice on the same mistake in a Claude Code session and it persists. What does Anthropic suggest?","o":["Start a fresh session with a better, more specific prompt that incorporates what you learned","Keep correcting Claude in the same session, since each correction trains it for later turns","Switch to a smaller, faster model in the same session so it re-reads your corrections quickly","Delete CLAUDE.md and the project's memory files, then repeat the same prompt in the same session"],"a":[0],"e":"A context full of failed attempts biases the model. A clean session with an improved prompt usually performs better.","k":"session hygiene, restart","src":"Claude Code best practices"},{"id":"CAD-16","s":"CAD","t":"s","q":"Which Claude Code option continues the most recent conversation in the current directory?","o":["claude --continue","claude --restore","claude --recent","claude --last-chat"],"a":[0],"e":"--continue resumes the latest conversation; --resume lets you choose a previous session.","k":"--continue, --resume","src":"Claude Code CLI reference"},{"id":"CAD-17","s":"CAD","t":"m","q":"Select THREE components that a Claude Code plugin can bundle.","o":["Skills","Hooks","MCP servers","Model weights"],"a":[0,1,2],"e":"Plugins package reusable extensions: skills, subagents, hooks, slash commands and MCP servers. They do not include model weights.","k":"plugins","src":"Claude Code plugins"},{"id":"CAD-18","s":"CAD","t":"s","q":"Why should plugins be installed only from trusted sources?","o":["They can include hooks and MCP servers that execute code with your permissions","They are signed by Anthropic, so the marketplace guarantees their code is reviewed","They permanently overwrite your CLAUDE.md and settings files with the plugin author's versions","They raise API billing by switching each session to the most expensive model tier"],"a":[0],"e":"A plugin can run commands and connect tools. Review what it contains before enabling it.","k":"plugin trust","src":"Claude Code plugins"},{"id":"CAD-19","s":"CAD","t":"s","q":"You create a custom skill in claude.ai. Will it automatically be available through the Claude API?","o":["No. API skills are uploaded separately through the Skills API and are workspace-wide, while claude.ai custom skills belong to the individual user","Yes. Skills created in claude.ai are published automatically to every API workspace in your organization","Yes, but only after you enable the code execution tool, which then pulls your claude.ai skills into the container","No. The API supports only pre-built skills such as pptx and xlsx, and custom skills cannot be uploaded to it at all"],"a":[0],"e":"Custom skills created in claude.ai are not available in the API. Each surface is managed separately: claude.ai skills are per user, API skills are workspace-wide. Claude Code can sync skills enabled on your claude.ai account when you sign in with it, but that does not extend to the API.","k":"skills across surfaces","src":"Agent Skills overview"},{"id":"CAD-20","s":"CAD","t":"s","q":"You write project conventions into CLAUDE.md. Which surface loads that file?","o":["Claude Code","claude.ai","Messages API","Batches API"],"a":[0],"e":"CLAUDE.md is a Claude Code memory mechanism. The raw API sees only what you put in the request.","k":"CLAUDE.md","src":"Claude Code memory"},{"id":"CAD-21","s":"CAD","t":"s","q":"An API response has stop_reason refusal. How should the application behave?","o":["Handle it explicitly, for example show a safe message or ask for a different request, instead of blindly retrying","Handle it as a normal end_turn, since the model finished its answer and the returned text is safe to store as the final result","Retry the same request with exponential backoff until the model returns a normal completion","Increase max_tokens and resend the same request, because the model ran out of room to respond"],"a":[0],"e":"A refusal is a distinct stop_reason on a successful HTTP 200 response. Read stop_details and handle it deliberately: show a safe message, change the request, or retry on a fallback model. Retrying the identical request on the same model does not help.","k":"stop_reason: refusal","src":"Handling stop reasons"},{"id":"CAD-22","s":"CAD","t":"s","q":"A user says, 'Use the file I uploaded yesterday in another chat.' The API request contains only today's messages. What follows?","o":["Claude has no access to it, because the model sees only the context sent in the current request","Claude fetches it from account-level file storage, since uploads persist across all of your chats","Claude can read it because the API caches earlier requests from the same key for 24 hours","Claude finds it through the user's identity in the metadata.user_id field of the request"],"a":[0],"e":"The API is stateless: anything the model should use must be in the request.","k":"stateless context","src":"Messages API"},{"id":"CAD-23","s":"CAD","t":"s","q":"You previously prefilled the assistant turn with '{' to force JSON. What happens on Claude 4.6 and later models?","o":["Prefilling the last assistant turn is unsupported and returns a 400 error; use system instructions or structured outputs instead","It works as before, but the prefilled text must now be sent in the system parameter instead of the final assistant turn","It is silently ignored: the model produces its normal reply and the prefilled text is dropped from the response","Prefilled text is accepted but capped at a few tokens, so use a stop_sequence on the closing brace instead"],"a":[0],"e":"Prefill is a breaking change from Claude 4.6. Structured outputs or clear instructions replace it.","k":"prefill removal","src":"Migration guide"},{"id":"CAD-24","s":"CAD","t":"s","q":"A prompt that shouts 'CRITICAL: you MUST ALWAYS...' over-triggers a rule on a newer model. What is the recommended fix?","o":["Use calm, clear wording and explain why the rule matters","Repeat the rule in bold capitals at the start and the end","Move the rule into a prefill so it carries more weight","Lower the temperature so the rule fires less often"],"a":[0],"e":"Recent models follow instructions closely, so emphatic language can cause over-application. Explaining the motivation works better.","k":"instruction clarity","src":"Prompting best practices"},{"id":"CAD-25","s":"CAD","t":"s","q":"A classification call uses structured outputs and needs multi-step reasoning to be accurate. What does Anthropic recommend?","o":["Let the model reason in thinking blocks, and ask for a short explanation field instead of a 'reasoning' or 'trace' field","Add a 'reasoning' field before 'label' in the schema so the chain of thought is copied into the JSON output","Sort the schema keys alphabetically, because generation follows key order and a sorted order improves accuracy","Return the full step-by-step trace in a 'trace' array property, which is the documented way to expose thinking in JSON"],"a":[0],"e":"A reasoning, thinking or trace field in JSON output can trigger a reasoning_extraction refusal on current models. Keep reasoning in thinking blocks and ask for a short explanation instead.","k":"reasoning_extraction refusal","src":"Structured outputs"},{"id":"CAD-26","s":"CAD","t":"s","q":"Where should text retrieved from the web or from user files be placed in the request?","o":["In a tool_result block with its source stated, never in the system prompt or plain user text","In the system prompt, so the model gives the retrieved text the same authority as your own rules","Appended directly to your instructions in the same paragraph, so the model reads it as one request","In an earlier assistant turn, so the model treats the retrieved text as its own prior statement"],"a":[0],"e":"Deliver third-party content in tool_result blocks and say what it is and where it came from. Do not put it in the system prompt or plain user text.","k":"content boundaries","src":"Mitigate jailbreaks and prompt injections"},{"id":"CM-01","s":"CM","t":"s","q":"Which Claude Code memory file is meant for personal, uncommitted preferences in a single project?","o":["./CLAUDE.local.md","~/.claude/CLAUDE.md","./.claude/CLAUDE.md","./.claude/rules/*.md"],"a":[0],"e":"CLAUDE.local.md is personal and project-specific, and is kept out of version control. ./CLAUDE.md is shared with the team.","k":"CLAUDE.local.md","src":"Claude Code memory"},{"id":"CM-02","s":"CM","t":"s","q":"On Linux, where does the organization-wide managed policy CLAUDE.md live?","o":["/etc/claude-code/CLAUDE.md","~/.config/claude-code/CLAUDE.md","/opt/claude-code/CLAUDE.md","$HOME/.claude/CLAUDE.md"],"a":[0],"e":"The managed policy file is system-wide and cannot be excluded by individual users. User memory is ~/.claude/CLAUDE.md; project memory is ./CLAUDE.md or ./.claude/CLAUDE.md.","k":"managed policy CLAUDE.md","src":"Claude Code memory"},{"id":"CM-03","s":"CM","t":"s","q":"Which order lists Claude Code settings scopes from highest to lowest precedence?","o":["Managed, command line, local project, shared project, user","User, shared project, local project, command line, managed","Shared project, user, managed, local project, command line","Command line, managed, user, local project, shared project"],"a":[0],"e":"Managed settings override everything. Then command-line settings, .claude/settings.local.json, .claude/settings.json and finally ~/.claude/settings.json.","k":"settings precedence","src":"Claude Code settings"},{"id":"CM-04","s":"CM","t":"s","q":"User settings allow Bash(git status) and project settings allow Bash(npm test). What is the effective permissions.allow list?","o":["Both entries, because list settings merge across scopes","The project entry, because project settings replace user ones","The user entry, because user-level settings override project files","Neither entry, because conflicting allow lists cancel each other out"],"a":[0],"e":"Array-valued settings such as permissions.allow are merged (concatenated) across scopes rather than replaced.","k":"settings merge","src":"Claude Code settings"},{"id":"CM-05","s":"CM","t":"s","q":"A repository's .claude/settings.json sets permissions.defaultMode to bypassPermissions. What happens when a developer opens it?","o":["The value is ignored, so a cloned repo cannot grant itself that mode","The mode is applied after a one-time trust prompt that the developer accepts","It overrides the user's own settings, though managed settings still outrank it","Claude Code rejects the repo and refuses to start until the setting is removed"],"a":[0],"e":"For safety, bypassPermissions and auto default modes from project or local settings are ignored.","k":"defaultMode restriction","src":"Claude Code settings"},{"id":"CM-06","s":"CM","t":"s","q":"Which combination provides organization-level enforcement a developer cannot override?","o":["Managed settings with permissions.deny rules and allowManagedHooksOnly","A project .claude/settings.json with permissions.deny rules committed to the repo","A personal ~/.claude/settings.json with permissions.deny rules and a hooks block","A CLAUDE.md in the repo root that lists forbidden commands and required hooks"],"a":[0],"e":"Managed settings sit at the highest precedence. Restricting hooks to managed sources prevents users from adding their own.","k":"managed settings","src":"Claude Code settings"},{"id":"CM-07","s":"CM","t":"s","q":"Why should production code reference a specific, pinned model identifier instead of a moving alias?","o":["So behavior does not change silently, and a new model is adopted only after evaluation","Because pinned identifiers are billed at a lower rate than aliases that follow new releases","Because pinned identifiers receive newer safety patches automatically, while aliases stay on old models","Because the API requires a dated identifier whenever the request includes tools or a system prompt"],"a":[0],"e":"Model upgrades can change behavior. Pinning and re-running evals before switching is a configuration-management control.","k":"model version pinning","src":"Models overview"},{"id":"CM-08","s":"CM","t":"s","q":"Which statement about model IDs is correct?","o":["From Claude 4.6 onward, dateless model IDs refer to pinned snapshots","From Claude 4.6 onward, dateless model IDs are moving aliases to the newest snapshot","Every Claude model ID must end in an eight-digit date such as 20251101 to be accepted","Model IDs are identical across the Claude API, Amazon Bedrock and Vertex AI"],"a":[0],"e":"Newer dateless IDs, such as claude-sonnet-5-5, are pinned snapshots. Older families used aliases that could move.","k":"model IDs","src":"Models overview"},{"id":"CM-09","s":"CM","t":"s","q":"Which practice best supports prompt versioning?","o":["Give each prompt a version, store it in version control with its eval results, and record which prompt and model versions are deployed","Edit the prompt directly in production when a problem appears, and describe the change in the team chat afterwards","Keep the prompt text in a shared document, and record the model alias that the application currently calls in production","Rename the prompt file with the date each day, and keep eval results in a separate spreadsheet that is unlinked to deployments"],"a":[0],"e":"Traceability lets you roll back, compare versions and explain behavior changes.","k":"prompt versioning","src":"Develop your test cases"},{"id":"CM-10","s":"CM","t":"s","q":"Which command creates a starter CLAUDE.md by analyzing the repository?","o":["/init","/clear","/login","/model"],"a":[0],"e":"/init generates an initial CLAUDE.md that you then refine and keep concise.","k":"/init","src":"Claude Code memory"},{"id":"CM-11","s":"CM","t":"s","q":"CLAUDE.md has grown very long and rules apply only to some directories. What is the recommended structure?","o":["Keep it under about 200 lines, use @path imports to organize it, and use .claude/rules with paths frontmatter for directory-scoped rules","Keep one root file of up to 1000 lines, and rely on /compact to trim it whenever the file grows too large","Keep one large file but add a table of contents at the top, since Claude reads all lines with equal weight","Raise the limit with a maxMemoryLines setting, and keep the rules for each directory together in the root CLAUDE.md file for simplicity"],"a":[0],"e":"Files under about 200 lines are followed more reliably. @path imports help organize content but still load at launch. Rules in .claude/rules with paths frontmatter load only when Claude works with matching files.","k":"CLAUDE.md organization","src":"Claude Code memory"},{"id":"CM-12","s":"CM","t":"s","q":"A team shares Claude Code plugins across its repositories. Which practice makes the setup reproducible?","o":["Commit the plugin and marketplace configuration to the repository and pin plugin versions","Ask each developer to install the plugins they prefer from the marketplace and note them in the README","Install the plugins in the CI environment and let developers copy them by hand into ~/.claude/plugins","Commit the plugin configuration but track the latest release of each plugin so fixes arrive immediately"],"a":[0],"e":"Pinned, version-controlled plugin configuration keeps tooling and dependencies consistent across the team.","k":"plugin dependencies","src":"Claude Code plugins"},{"id":"CC-01","s":"CC","t":"s","q":"Claude Code is started in /repo/services/api. Which CLAUDE.md files are loaded at launch?","o":["Files in the working directory and every parent directory up to the root; subdirectory files load on demand when Claude works with files there","Files in the working directory and every subdirectory beneath it; parent directory files load on demand when Claude reads them","Every CLAUDE.md in the whole repository, loaded at launch no matter which directory Claude is started in or working in","The working directory file and the user-level file in ~/.claude; parent directory and subdirectory files are skipped"],"a":[0],"e":"CLAUDE.md files from the current directory and its ancestors are concatenated. Subdirectory files are loaded when Claude reads or edits files in those directories.","k":"CLAUDE.md hierarchy","src":"Claude Code memory"},{"id":"CC-02","s":"CC","t":"s","q":"Which location holds Markdown prompt files that become project-level custom slash commands?","o":[".claude/commands/",".claude/hooks/",".claude/prompts/","~/.claude/commands/"],"a":[0],"e":"A Markdown file such as .claude/commands/review.md becomes the /review command for that project. Personal commands live in ~/.claude/commands/. Skills (.claude/skills/<name>/SKILL.md) can also be invoked as slash commands.","k":"custom slash commands","src":"Claude Code slash commands"},{"id":"CC-03","s":"CC","t":"s","q":"Which skill frontmatter setting prevents Claude from invoking the skill on its own, so only the user can trigger it?","o":["disable-model-invocation: true","user-invocable: false in SKILL.md","context: fork (runs in a subagent)","allowed-tools: [] (empty list)"],"a":[0],"e":"disable-model-invocation: true stops automatic invocation. user-invocable controls whether the user can call the skill, and context: fork runs it in a subagent.","k":"disable-model-invocation","src":"Claude Code skills"},{"id":"CC-04","s":"CC","t":"m","q":"Select the TWO frontmatter fields that are required in a Claude Code subagent definition.","o":["name","description","tools","model"],"a":[0,1],"e":"A subagent file needs name and description. tools, model, memory, maxTurns and others are optional.","k":"subagent definition","src":"Claude Code subagents"},{"id":"CC-05","s":"CC","t":"s","q":"Which subagent frontmatter field gives a subagent persistent memory across sessions?","o":["memory","maxTurns","isolation","skills"],"a":[0],"e":"The memory field enables persistent, per-agent memory. isolation: worktree runs the agent in a separate git worktree.","k":"agent memory","src":"Claude Code subagents"},{"id":"CC-06","s":"CC","t":"s","q":"In a headless run, which output format gives incremental events as they are produced (streaming mode)?","o":["--output-format stream-json","--output-format text","--output-format json","--input-format stream-json"],"a":[0],"e":"claude -p supports text, json and stream-json. stream-json emits newline-delimited events as the run progresses. The official example also passes --verbose, and --include-partial-messages adds token-level deltas.","k":"stream-json","src":"Claude Code headless"},{"id":"CC-07","s":"CC","t":"s","q":"Which Claude Code permission mode automatically approves file edits but still asks before other risky actions?","o":["acceptEdits","bypassPermissions","default","dontAsk"],"a":[0],"e":"acceptEdits auto-accepts edits in the working directory. bypassPermissions skips prompts entirely and should be limited to isolated environments.","k":"permission modes","src":"Claude Code permissions"},{"id":"CC-08","s":"CC","t":"s","q":"Which settings.json key pre-approves specific commands or tools so Claude Code does not prompt for them?","o":["permissions.allow","permissions.ask","permissions.deny","settings.autoApprove"],"a":[0],"e":"permissions.allow, permissions.ask and permissions.deny hold the rules. Deny rules apply even when other scopes allow the action.","k":"permissions.allow","src":"Claude Code settings"},{"id":"CC-09","s":"CC","t":"s","q":"How much of Claude Code's auto memory index is loaded at the start of each session?","o":["The first 200 lines or 25 KB","The whole file regardless of size","The first 500 lines or 100 KB","The last 200 lines or 25 KB"],"a":[0],"e":"Only the beginning of the memory index is loaded at startup, so keep it concise and move detail into topic files.","k":"auto memory","src":"Claude Code memory"},{"id":"DBG-01","s":"DBG","t":"s","q":"A request returns HTTP 413 request_too_large. What is the appropriate response?","o":["Reduce the request size (the Messages API limit is 32 MB), for example by using the Files API or smaller images","Retry immediately with exponential backoff, since 413 signals a transient server-side capacity problem","Raise max_tokens so the response fits, since 413 means the output exceeded the endpoint limit","Wait for the rate limit window to reset, then resend the identical request with a longer timeout"],"a":[0],"e":"413 means the payload exceeds the endpoint limit: 32 MB for Messages, 256 MB for Batches, 500 MB for Files. Retrying the same request will not help.","k":"413 request_too_large","src":"Errors"},{"id":"DBG-02","s":"DBG","t":"s","q":"A valid API key returns 403 permission_error. What is the most likely cause?","o":["The key lacks permission for the requested resource or feature","The key string is malformed, expired or has been revoked","The request body exceeds the endpoint's maximum payload size","The service is temporarily overloaded and is shedding new requests"],"a":[0],"e":"401 authentication_error means the key is missing or invalid. 403 permission_error means the key is valid but not allowed to do that.","k":"401 vs 403","src":"Errors"},{"id":"DBG-03","s":"DBG","t":"s","q":"Intermittent 529 overloaded_error responses appear during peak hours. Which strategy fits?","o":["Retry with exponential backoff and jitter, and consider a fallback model or queued processing","Fix the request body and resend it immediately, since 529 means the JSON failed schema validation","Rotate the API key and retry, since 529 means the key has hit its per-key capacity quota","Reduce the sampling temperature and max_tokens so each request needs less server capacity"],"a":[0],"e":"529 is a transient capacity condition. Backoff, a fallback, or deferring non-urgent work are the standard responses.","k":"529 overloaded_error","src":"Errors"},{"id":"DBG-04","s":"DBG","t":"s","q":"Which identifier should be logged for every API call so Anthropic support can trace a failed request?","o":["The request-id response header (also request_id in error bodies)","The model name and the anthropic-version header sent with the request","The user's email address and organization ID from the Console","The SDK version and the client's local timestamp of the request"],"a":[0],"e":"Each response carries a unique request ID. Logging it makes failures traceable.","k":"request-id","src":"Errors"},{"id":"DBG-05","s":"DBG","t":"s","q":"The app shows malformed JSON from Claude. How do you decide whether the integration layer or the model output is at fault?","o":["Log the exact request and raw response, then replay it directly: wrong raw output points to the prompt or model, correct output to the integration","Count how often the JSON fails in production; a failure rate above 5 percent means the model is at fault, otherwise the integration is","Ask Claude in a follow-up turn to explain why its output was malformed, and treat that self-diagnosis as the definitive root cause","Inspect the parsed object in your application logs; if it is malformed, the model is at fault, because your parser would have rejected anything else"],"a":[0],"e":"Isolating the origin means comparing what was sent and what was received at the boundary. If the raw response is correct, the bug is in your own parsing or post-processing.","k":"problem origin isolation","src":"Errors; general debugging practice"},{"id":"DBG-06","s":"DBG","t":"s","q":"A trace shows an agent calling the same tool with the same arguments ten times, and each result is the error 'failed'. Which fix is most appropriate?","o":["Return instructive error messages (what went wrong and how to fix it) and enforce a maximum number of turns","Raise the sampling temperature so the model varies its arguments until some call succeeds","Remove the tool from the tool list and let the model answer from its training data instead of calling anything","Increase max_tokens so the model has room to reason, and keep the error text short, like 'failed', to save tokens"],"a":[0],"e":"Vague errors give the model nothing to correct. Informative errors plus a loop limit prevent runaway cycles.","k":"trace analysis, loop failure","src":"Writing tools for agents"},{"id":"DBG-07","s":"DBG","t":"s","q":"On Claude 4.5 and later models, input tokens plus max_tokens exceed the context window. What happens?","o":["The request is accepted, and generation stops with stop_reason model_context_window_exceeded when the window is full","The API returns a 400 invalid_request_error before generation starts, because the sum must fit within the window","The model silently drops the oldest input tokens to make room, and generation then completes with stop_reason end_turn","The request is accepted, and generation stops with stop_reason max_tokens when the output limit is reached"],"a":[0],"e":"If the input itself exceeds the window, the API returns 400 ('prompt is too long'). When only input plus max_tokens exceeds it, generation stops at the limit with a specific stop reason.","k":"model_context_window_exceeded","src":"Context windows"},{"id":"DBG-08","s":"DBG","t":"s","q":"A tool call fails in your code. How should you report this back so Claude can recover?","o":["Return a tool_result with is_error set to true and a clear message","Omit the tool_result and send the next user message to move on","Raise an exception in your loop and restart the conversation","Return an assistant message with is_error set and a stack trace"],"a":[0],"e":"Every tool_use needs a matching tool_result. Setting is_error and explaining the failure lets Claude adapt, for example by fixing arguments.","k":"tool_result is_error","src":"Handle tool calls"},{"id":"LLM-01","s":"LLM","t":"s","q":"What is a token in the context of Claude?","o":["A unit of text the model processes, which may be a whole word, part of a word or punctuation","A unit of text the model processes, defined as one whole word delimited by spaces","A unit of text the model processes, defined as one character from the Unicode set","A prepaid billing credit that pays for API calls, priced per request regardless of text"],"a":[0],"e":"Models read and generate tokens. Usage, limits and prices are all measured in tokens, and the count depends on the tokenizer.","k":"token","src":"Glossary"},{"id":"LLM-02","s":"LLM","t":"s","q":"How does an LLM generate text?","o":["Autoregressively: it predicts a probability distribution for the next token, selects one, appends it and repeats","By retrieval: it embeds the prompt, looks up the closest stored answer in an index and returns it verbatim","By template filling: it selects a fixed script for the detected intent and substitutes the user's words into it","In parallel: it predicts every token of the response at once, independent of the tokens that precede them"],"a":[0],"e":"Generation is next-token prediction, one token at a time, each conditioned on everything before it.","k":"next-token generation","src":"Glossary"},{"id":"LLM-03","s":"LLM","t":"s","q":"On a model that accepts it (for example Claude Haiku 4.5): what does raising the temperature do?","o":["It makes sampling more random, so outputs become more varied","It makes the model more accurate, so facts become reliable","It enlarges the context window, so longer inputs can be handled","It makes decoding deterministic, so outputs become repeatable"],"a":[0],"e":"Temperature scales the probability distribution before sampling. Low values favor the most likely tokens, high values increase diversity. Claude Opus 4.7 and later, Sonnet 5.5 and Fable 5.1 reject non-default temperature, top_p and top_k with a 400, so omit them there; Haiku 4.5 and older models still accept them.","k":"temperature","src":"Messages API"},{"id":"LLM-04","s":"LLM","t":"s","q":"On a model that accepts the temperature parameter (for example Claude Haiku 4.5), the same prompt is sent twice with temperature 0. Which statement is correct?","o":["The outputs are usually very similar but are not guaranteed to be identical","The outputs are guaranteed bit-for-bit identical, since sampling is deterministic","The outputs usually differ a lot, because temperature 0 maximizes random sampling","The API returns an error on every Claude model, since temperature must be greater than zero"],"a":[0],"e":"Even at temperature 0, results are not fully deterministic. Design systems to tolerate variation. Claude Opus 4.7 and later, Sonnet 5.5 and Fable 5.1 reject non-default temperature with a 400, so omit it there and steer with prompting.","k":"non-determinism","src":"Messages API"},{"id":"LLM-05","s":"LLM","t":"s","q":"What counts toward the context window in a request?","o":["The input messages, system prompt and tools, plus the generated output including thinking tokens","The input messages and system prompt, with tools and generated output counted separately","The input messages, system prompt and tools, plus the generated text but excluding thinking tokens","The user's latest message and the model's reply, with earlier turns and the system prompt excluded"],"a":[0],"e":"The context window is the total working memory of a request. Thinking tokens are part of it and count toward max_tokens.","k":"context window","src":"Context windows"},{"id":"LLM-06","s":"LLM","t":"s","q":"After migrating to a newer model with a new tokenizer, the same text produces about 30% more tokens. What is the correct implication?","o":["Re-estimate token budgets, max_tokens and costs for that model","Keep current budgets, because tokenizers give identical counts","Expect lower bills, since per-token prices fall with a new tokenizer","Expect the context window to shrink automatically by the same 30 percent"],"a":[0],"e":"Token counts depend on the tokenizer. The tokenizer introduced with Opus 4.7 can produce roughly 30% more tokens for the same text (up to about 35% depending on content), so budgets must be re-measured.","k":"tokenizer change","src":"Pricing; Migration guide"},{"id":"LLM-07","s":"LLM","t":"s","q":"A prompt contains three worked input-output examples before the real task. What is this technique called?","o":["Multi-shot (few-shot) prompting","Zero-shot (no-example) prompting","One-shot (one-example) prompting","Fine-tuning (weight retraining)"],"a":[0],"e":"Zero-shot gives no examples, one-shot gives one, and multishot (few-shot) gives several. The examples show the desired format and behavior.","k":"zero-shot, one-shot, multishot","src":"Prompting best practices"},{"id":"LLM-08","s":"LLM","t":"s","q":"What is the recommended way to include examples in a prompt?","o":["3 to 5 relevant, diverse examples wrapped in <example> tags inside <examples>","10 to 20 identical examples in one <sample> block at the end of the prompt","1 to 2 highly similar examples wrapped in <demo> tags, placed after the final question","3 to 5 examples chosen from one narrow case, written as plain prose without any tags"],"a":[0],"e":"Anthropic recommends a handful of examples that reflect real inputs and vary enough to avoid overfitting, clearly tagged.","k":"multi-shot examples","src":"Prompting best practices"},{"id":"LLM-09","s":"LLM","t":"s","q":"How are thinking tokens billed?","o":["As output tokens, counted in full, and they count toward max_tokens","As input tokens at the cached rate, outside the max_tokens limit","As output tokens, billed on the displayed summary rather than the full reasoning","At a flat per-request reasoning fee, outside output pricing and max_tokens"],"a":[0],"e":"Reasoning consumes output tokens even when summarized or omitted from the response, so budget max_tokens and cost accordingly.","k":"extended thinking tokens","src":"Extended thinking"},{"id":"LLM-10","s":"LLM","t":"s","q":"What does thinking.type 'adaptive' do?","o":["Lets Claude decide whether and how much to think for each request, guided by the effort setting","Sets a fixed thinking budget in tokens for each request, from the budget_tokens parameter","Switches to a faster model tier when a request looks simple, guided by the effort setting","Applies maximum thinking depth to each request, regardless of effort and complexity"],"a":[0],"e":"Adaptive thinking is a thinking mode. Effort (low, medium, high, xhigh, max) guides how much the model thinks and works overall.","k":"adaptive thinking","src":"Adaptive thinking"},{"id":"LLM-11","s":"LLM","t":"s","q":"Which of these is NOT a valid effort level?","o":["adaptive","medium","xhigh","low"],"a":[0],"e":"Effort levels are low, medium, high, xhigh and max. adaptive is a thinking mode, not an effort level.","k":"effort levels","src":"Effort"},{"id":"LLM-12","s":"LLM","t":"s","q":"Which output does the effort parameter influence?","o":["All output tokens: text, tool calls and thinking","Thinking tokens: depth of reasoning, not text or tool calls","Final answer text, not tool calls or thinking","Input tokens: system prompt, tools and cached blocks"],"a":[0],"e":"Effort affects overall token spend on the response, including answer text and tool calls, not just thinking.","k":"effort scope","src":"Effort"},{"id":"LLM-13","s":"LLM","t":"s","q":"What trade does fast mode make on supported Opus models?","o":["Up to about 2.5x faster output at premium pricing","Up to about 5x faster output at standard pricing","Up to about 2.5x faster output at lower quality","Up to about 2.5x larger context at premium pricing"],"a":[0],"e":"Fast mode increases output speed for a premium price. It is a latency versus cost trade-off, not a quality change.","k":"fast mode","src":"Fast mode"},{"id":"LLM-14","s":"LLM","t":"s","q":"On a model that accepts it (for example Claude Haiku 4.5): which sampling parameter restricts selection to the smallest set of tokens whose cumulative probability reaches a threshold?","o":["top_p","top_k","min_p","top_n"],"a":[0],"e":"top_p (nucleus sampling) keeps the smallest set of tokens whose probabilities sum to p. top_k keeps a fixed number of the most likely tokens. Claude Opus 4.7 and later, Sonnet 5.5 and Fable 5.1 reject non-default temperature, top_p and top_k with a 400, so omit them there; Haiku 4.5 and older models still accept them.","k":"top_p","src":"Messages API"},{"id":"LLM-15","s":"LLM","t":"s","q":"A user asks Claude about an event that happened after its training data ended. What is the correct design response?","o":["Provide the information through tools such as web search or retrieval, because the model's knowledge has a cutoff","Ask the model to recall it with a higher temperature setting, because its knowledge refreshes continuously","Increase effort to xhigh so the model can reason its way to the event, because thinking adds new facts","Instruct the model to verify the event from memory, because Claude updates its weights during each chat"],"a":[0],"e":"Models learn from data up to a training cutoff. Current information must be supplied in context.","k":"knowledge cutoff","src":"Models overview"},{"id":"LLM-16","s":"LLM","t":"s","q":"What does a stop sequence do?","o":["It ends generation when the model produces the given string, and the stop_reason is stop_sequence","It removes the given string from the prompt before sending it, and the stop_reason is end_turn","It ends generation when the model produces the given string, and the stop_reason is max_tokens","It forces the model to call the named tool next, and the stop_reason is tool_use"],"a":[0],"e":"stop_sequences are custom strings that halt generation. The response reports which one matched.","k":"stop_sequences","src":"Messages API"},{"id":"TF-01","s":"TF","t":"s","q":"What do the official Claude SDKs provide on top of the REST API?","o":["Authentication headers, typed request and response objects, retries, timeouts and streaming helpers","Fine-tuning jobs, model hosting, local inference and GPU scheduling for weights on your own machine","A replacement HTTP protocol with its own wire format, so that REST calls are no longer needed","Free usage tiers, higher rate limits, discounted token prices and priority access on every plan"],"a":[0],"e":"The SDKs wrap the REST API with conveniences, so you do not hand-write HTTP plumbing.","k":"SDK","src":"Client SDKs"},{"id":"TF-02","s":"TF","t":"s","q":"By default, how do the SDKs treat transient failures such as connection errors, 429 and 5xx responses?","o":["They retry up to two times with exponential backoff, honoring retry-after when present","They retry up to ten times with fixed one-second delays, ignoring any retry-after","They retry up to two times on 400 and 401 errors, with no delay between the attempts","They raise the error at once and leave all retry logic to the calling application"],"a":[0],"e":"Automatic retries are enabled with a small default; you can raise or disable them.","k":"SDK retries","src":"Errors"},{"id":"TF-03","s":"TF","t":"s","q":"Which environment variable does the Anthropic SDK read for the API key by default?","o":["ANTHROPIC_API_KEY","CLAUDE_API_KEY","ANTHROPIC_SECRET_KEY","ANTHROPIC_ACCESS_KEY"],"a":[0],"e":"Clients pick up ANTHROPIC_API_KEY unless you pass a key explicitly, which keeps secrets out of code.","k":"ANTHROPIC_API_KEY","src":"Client SDKs"},{"id":"TF-04","s":"TF","t":"s","q":"How does a WebSocket differ from server-sent events?","o":["A WebSocket is a persistent full-duplex channel; SSE is a one-way server-to-client stream over HTTP","A WebSocket is a one-way server-to-client stream over HTTP; SSE is a persistent full-duplex channel","Each is a full-duplex channel; SSE carries binary frames while a WebSocket carries text events","A WebSocket is built on UDP datagrams with no ordering; SSE is a one-way client-to-server upload over HTTP"],"a":[0],"e":"The Claude API streams with SSE. WebSockets are bidirectional and are used for other kinds of real-time interactions.","k":"WebSocket vs SSE","src":"Streaming messages"},{"id":"TF-05","s":"TF","t":"s","q":"Which failures should generally NOT be retried without changing the request?","o":["Request or credential errors such as 400 invalid_request_error and 401 authentication_error","429 rate limits that carry a retry-after","5xx server errors such as 500 and 529","Network timeouts and dropped connections"],"a":[0],"e":"Client errors reflect a problem in the request or credentials. Retrying the same request fails again, while 429, 5xx and timeouts are transient.","k":"HTTP status classes","src":"Errors"},{"id":"TF-06","s":"TF","t":"s","q":"Which of the following is valid JSON?","o":["{\"name\": \"Ada\", \"age\": 36}","{'name': 'Ada', 'age': 36}","{\"name\": \"Ada\", \"age\": 36,}","{\"name\": \"Ada\", \"age\": 36} // x"],"a":[0],"e":"JSON requires double-quoted keys and strings, and permits neither trailing commas nor comments.","k":"JSON syntax","src":"JSON"},{"id":"TF-07","s":"TF","t":"s","q":"The API returns a 429 with a retry-after header. What should the client do?","o":["Wait at least that long before retrying","Retry at once with a smaller max_tokens","Double the request rate to clear the queue","Treat it as a client error and stop retrying"],"a":[0],"e":"retry-after tells you when capacity should be available. The SDK honors it.","k":"retry-after","src":"Rate limits"},{"id":"TF-08","s":"TF","t":"s","q":"A list endpoint such as batches returns has_more: true. How do you fetch the next page?","o":["Pass the last returned ID as the after_id cursor parameter","Pass the first returned ID as the after_id cursor parameter","Pass the next page number as the offset query parameter","Follow the Link header URL returned in the response"],"a":[0],"e":"Message Batches, Models and several Admin API list endpoints take after_id and before_id and return has_more, first_id and last_id. Pass last_id as after_id to get the next page.","k":"cursor pagination","src":"API overview"},{"id":"TF-09","s":"TF","t":"s","q":"Why does sending an image as base64 affect request size limits?","o":["Base64 encoding increases the data size by about one third","Base64 encoding reduces the data size by about one third","Base64 encoding increases the data size by about two thirds","Base64 encoding lowers the image resolution before the size is counted"],"a":[0],"e":"Base64 represents 3 bytes as 4 characters, so the payload grows by roughly 33%. This counts toward the request size limit.","k":"base64 overhead","src":"Vision"},{"id":"TF-10","s":"TF","t":"s","q":"Which of these sets of limits matches the documented maximum request sizes?","o":["Messages 32 MB, Batches 256 MB, Files 500 MB","Messages 1 MB, Batches 10 MB, Files 50 MB","Messages 500 MB, Batches 32 MB, Files 256 MB","Messages 8 MB, Batches 100 MB, Files 200 MB"],"a":[0],"e":"The documented maximums are 32 MB for Messages requests, 256 MB for Batches and 500 MB for Files.","k":"request size limits","src":"Errors"},{"id":"TF-11","s":"TF","t":"s","q":"Which change most directly reduces the total response time of an output-heavy request?","o":["Reduce the number of output tokens generated, for example by asking for concise output","Increase the number of examples in the prompt, for example by adding ten more samples","Raise the temperature so that the model reaches a stopping point earlier","Add more XML tags around each section so the model can parse the prompt more quickly"],"a":[0],"e":"Output is generated token by token, so fewer output tokens means lower latency. Time to first token depends mostly on input size.","k":"latency","src":"Reduce latency"},{"id":"TF-12","s":"TF","t":"s","q":"What is the purpose of the token counting endpoint?","o":["To estimate the input tokens of a request before sending it; it is free and has its own rate limits","To count the output tokens of a response after generation; it is billed at the standard output rate","To pre-compute a prompt prefix and store it for reuse; it is billed as a cache write at 1.25x","To list the models available to your key with their context limits; it is free and unmetered"],"a":[0],"e":"Token counting returns an estimate for budgeting and checking limits without running the model.","k":"token counting","src":"Token counting"},{"id":"TF-13","s":"TF","t":"s","q":"Which Python SDK exception class represents an HTTP 429 response?","o":["RateLimitError","BadRequestError","NotFoundError","APITimeoutError"],"a":[0],"e":"SDK errors are typed by status: 400 BadRequestError, 401 AuthenticationError, 429 RateLimitError, 5xx InternalServerError.","k":"SDK error classes","src":"Python SDK"},{"id":"TF-14","s":"TF","t":"s","q":"What does the anthropic-version header select?","o":["The version of the API contract your request follows","The version of the model that handles your request","The version of the SDK that sends your request","The version of the beta feature set enabled for your request"],"a":[0],"e":"It pins the API contract. Models are chosen with the model parameter.","k":"anthropic-version","src":"API overview"},{"id":"TF-15","s":"TF","t":"s","q":"How do you opt in to a beta API feature?","o":["Send the feature's identifier in the anthropic-beta header","Add -beta to the model name, such as claude-opus-5-5-beta","Send the feature's identifier in the anthropic-version header","Nothing; beta features are enabled by default for every API key"],"a":[0],"e":"Betas are enabled per request using the anthropic-beta header (or the SDK's beta namespace). Beta behavior may change.","k":"anthropic-beta","src":"Beta headers"},{"id":"TF-16","s":"TF","t":"s","q":"Which usage fields does every Messages response report?","o":["input_tokens and output_tokens, plus cache fields when caching is used","prompt_tokens and completion_tokens, plus a total_cost field when billing is enabled","input_tokens and output_tokens, plus a latency_ms field when timing is enabled","total_tokens and cost_usd, plus cache fields when caching is used"],"a":[0],"e":"The usage object reports token counts, which you use for tracking cost and capacity.","k":"usage object","src":"Messages API"},{"id":"TF-17","s":"TF","t":"s","q":"A single-page web app calls the Claude API directly from the browser with an embedded key. What is wrong?","o":["The key is exposed to every user; calls should go through a backend that holds the key","Nothing is wrong, provided the bundle is minified and the key is base64-encoded","The key is shared across origins; calls should be limited with CORS allowlists in the Claude console","Headers are stripped by browsers; the key should be sent in the URL query string instead"],"a":[0],"e":"Secrets must stay server-side. A backend proxy can hold the key, enforce limits and authorize users.","k":"server-side API key","src":"API key best practices"},{"id":"MST-01","s":"MST","t":"s","q":"A pipeline classifies and routes millions of short support messages, where speed and cost matter most. Which model tier is the best fit?","o":["Claude Haiku 4.5","Claude Fable 5.1","Claude Opus 5.5","Claude Sonnet 5.5"],"a":[0],"e":"Haiku is the fastest and lowest-cost tier, suited to high-volume, latency-sensitive classification and routing. Larger tiers cost more per token.","k":"Haiku use cases","src":"Models overview"},{"id":"MST-02","s":"MST","t":"s","q":"Which description best matches Claude Sonnet 5.5?","o":["The best combination of speed and intelligence for everyday workloads","The fastest and cheapest model, for high-volume classification and routing","The most capable model, for the hardest reasoning where cost matters least","A legacy model kept for compatibility, with no tool use or vision"],"a":[0],"e":"Sonnet 5.5 is described as the best combination of speed and intelligence. Fable 5.1 targets demanding reasoning and long-horizon agentic work, and Haiku 4.5 is the fastest and lowest-cost model.","k":"Sonnet use cases","src":"Models overview"},{"id":"MST-03","s":"MST","t":"s","q":"A team needs a model for long-running agentic coding tasks across a large code base. Which model is the intended fit?","o":["Claude Opus 5.5","Claude Haiku 4.5","Claude Haiku 3","Claude Sonnet 3.7"],"a":[0],"e":"Opus 5.5 is aimed at long-running, complex agentic and coding work. Its default effort level is medium.","k":"Opus use cases","src":"Models overview"},{"id":"MST-04","s":"MST","t":"s","q":"For which scenario is Claude Fable 5.1 the best choice, given its higher price and slower output?","o":["The most demanding reasoning tasks, where quality matters more than cost or latency","High-volume classification and routing, where throughput matters more than depth","Real-time autocomplete and chat, where sub-second latency matters more than depth","Early prototypes and demos, where a small budget matters more than output quality"],"a":[0],"e":"Fable 5.1 is priced at $10 and $50 per million input and output tokens, and it is intended for tasks that need the most capability.","k":"Fable use cases","src":"Models overview"},{"id":"MST-05","s":"MST","t":"s","q":"A request with tool_choice set to any (or a specific tool) is sent to Claude Opus 5.5. What happens?","o":["The API returns a 400 error; use auto or none, strict tool use, or structured outputs instead","The request succeeds and the model is forced to call the named tool (stop_reason tool_use)","The request succeeds, but Claude chooses tools itself and adds a warning header","The request succeeds but is billed at double the input price for every tool definition"],"a":[0],"e":"Forced tool use is a breaking change on Opus 5.5, Sonnet 5.5 and Fable 5.1. auto and none still work.","k":"forced tool use unsupported","src":"Migration guide"},{"id":"MST-06","s":"MST","t":"s","q":"Existing code sends thinking: {type: 'enabled', budget_tokens: ...} to Claude Opus 4.7 or later. What happens?","o":["The request is rejected; use thinking type adaptive with output_config.effort","It runs as before, but budget_tokens is capped at 4,096 with a warning","It is accepted, but budget_tokens is ignored and adaptive thinking applies automatically","The request is rejected; use thinking type manual with a budget in output_config.budget"],"a":[0],"e":"Manual extended thinking budgets were replaced on newer models by adaptive thinking guided by effort.","k":"thinking type enabled rejected","src":"Migration guide"},{"id":"MST-07","s":"MST","t":"s","q":"A product has easy FAQ questions (80% of traffic) and hard multi-step cases (20%). Which design best balances quality, latency and cost?","o":["Route easy requests to a small, fast model and hard ones to a more capable model","Send every request to the largest model, so quality is maximized on all traffic","Send every request to the smallest model and add more few-shot examples to cover the hard cases","Route hard requests to the small, fast model and easy ones to the more capable model"],"a":[0],"e":"Routing sends each input to an appropriate model tier, saving cost and latency without giving up quality on hard cases.","k":"quality, latency, cost trade-off","src":"Choosing a model"},{"id":"MST-08","s":"MST","t":"s","q":"A single task needs a 600,000-token prompt. Which of these models can accept it?","o":["Claude Sonnet 5.5, which has a 1M-token context window","Claude Haiku 4.5, which has a 200K-token context window","Claude Sonnet 5.5, which has a 200K-token context window","Claude Haiku 4.5, which has a 1M-token context window"],"a":[0],"e":"Haiku 4.5 offers 200K context and 64K max output. The newer larger models offer 1M context and 128K max output.","k":"context window by model","src":"Models overview"},{"id":"CTM-01","s":"CTM","t":"s","q":"A 100,000-token prefix is sent in 10 requests on Claude Opus 5.5 (input $4 per MTok). With a 5-minute cache write at 1.25x and cache reads at 0.05x, what is the approximate input cost for the prefix compared with no caching?","o":["About $0.68 cached versus $4.00 uncached","About $4.00 cached versus $0.68 uncached","About $0.40 cached versus $4.00 uncached","About $2.00 cached versus $4.00 uncached"],"a":[0],"e":"Uncached: 10 x 100k x $4/MTok = $4.00. Cached: one write at 1.25 x $0.40 = $0.50, plus nine reads at 0.05 x $0.40 = $0.02 each = $0.18, total $0.68.","k":"cost modeling with prompt caching","src":"Prompt caching"},{"id":"CTM-02","s":"CTM","t":"s","q":"What is the cache write cost multiplier for the 1-hour TTL, relative to the base input price?","o":["2x","1.25x","0.1x","1x"],"a":[0],"e":"The 5-minute cache write costs 1.25x base input, the 1-hour write costs 2x, and cache reads cost a fraction of base input.","k":"cache TTL pricing","src":"Prompt caching"},{"id":"CTM-03","s":"CTM","t":"s","q":"How many explicit cache breakpoints can a request contain?","o":["4","1","10","8"],"a":[0],"e":"Up to four cache_control breakpoints are allowed. The system also checks a limited number of preceding blocks (lookback) for earlier cache entries.","k":"cache breakpoints","src":"Prompt caching"},{"id":"CTM-04","s":"CTM","t":"s","q":"Which change invalidates previously cached message blocks while leaving cached tools and system prompt intact?","o":["Changing tool_choice","Editing a tool spec","Editing the system prompt","Appending a new user turn"],"a":[0],"e":"The caching hierarchy is tools, system, messages. Changing tool_choice affects the messages level, not the tools or system levels.","k":"cache invalidation","src":"Prompt caching"},{"id":"CTM-05","s":"CTM","t":"s","q":"A response reports input_tokens 50, cache_creation_input_tokens 2000 and cache_read_input_tokens 8000. How many input tokens did the request contain in total?","o":["10,050","10,000","8,050","2,000"],"a":[0],"e":"input_tokens counts only the tokens after the last cache breakpoint. Total input = input_tokens + cache_creation_input_tokens + cache_read_input_tokens.","k":"usage tracking","src":"Prompt caching"},{"id":"CTM-06","s":"CTM","t":"s","q":"On Claude Haiku 4.5, a 3,000-token system prompt is marked with cache_control, but nothing is cached. Why?","o":["Haiku 4.5 requires a minimum of 4,096 tokens for a cacheable prefix","Haiku 4.5 requires a minimum of 2,048 tokens for a cacheable prefix","Haiku 4.5 caps a cacheable prefix at 2,048 tokens, and 3,000 exceeds that cap","Haiku 4.5 needs the extended-cache-ttl beta header before cache_control is honored"],"a":[0],"e":"Minimum cacheable length depends on the model. Shorter prefixes are processed normally without an error.","k":"minimum cacheable length","src":"Prompt caching"},{"id":"CTM-07","s":"CTM","t":"s","q":"An output-heavy workload is expensive. Which lever is usually the most direct?","o":["Constrain output length and lower effort where quality allows, because output tokens cost several times more than input tokens","Add more few-shot examples and background documents to the prompt, because input tokens cost several times more than output tokens","Raise effort to max so the model finishes in fewer turns, because output tokens cost the same as input tokens","Increase max_tokens so responses finish without truncation, because retries on cut-off outputs cost more than long outputs"],"a":[0],"e":"Output tokens are priced higher than input tokens (for example $2 input versus $10 output per million on Sonnet 5.5). Reducing generated tokens cuts cost.","k":"token budgeting, output cost","src":"Pricing"},{"id":"CTM-08","s":"CTM","t":"s","q":"Two workspaces in the same organization send the same long cached prefix. What happens with caching?","o":["Caches are isolated per workspace, so each workspace creates its own cache entry","Caches are shared across the organization, so the second workspace gets a hit","Caches are isolated per API key, so each key in the organization creates its own cache entry","Caches are shared within the organization but billed as new cache writes in each workspace"],"a":[0],"e":"Cache entries are not shared across workspaces, so cost modeling should account for a separate cache write per workspace.","k":"workspace cache isolation","src":"Prompt caching"},{"id":"TF-18","s":"TF","t":"s","q":"An application wants to know how many requests and tokens remain in the current rate limit window. Where can it read this?","o":["In the anthropic-ratelimit-* response headers returned with API responses","In the usage object of each Messages response body, next to the token counts","In the retry-after header that accompanies each successful API response","From the token counting endpoint, which returns the remaining quota for each window"],"a":[0],"e":"The API returns rate limit headers (limit, remaining, reset) with each response. They let clients throttle themselves before receiving a 429.","k":"rate limit headers","src":"Rate limits"},{"id":"CE-01","s":"CE","t":"s","q":"As a conversation grows very long, answer quality on early details declines even though the window is not full. What is this effect called?","o":["Context rot","Cache expiry","Rate limiting","Model drift"],"a":[0],"e":"Accuracy and recall degrade as the amount of context grows, so more context is not always better. Curate what is in the window.","k":"context rot","src":"Context windows"},{"id":"CE-02","s":"CE","t":"s","q":"With default settings, what does the context-editing strategy clear_tool_uses_20250919 do?","o":["When input exceeds 100,000 tokens, it clears the oldest tool results and keeps the 3 most recent tool uses","When input exceeds 50,000 tokens, it clears the oldest tool results and keeps the 10 most recent tool uses","When input exceeds 100,000 tokens, it summarizes the oldest turns with a model-generated recap and keeps the last 3 messages","When the context window is completely full, it clears all thinking blocks and keeps the 3 most recent assistant turns"],"a":[0],"e":"The defaults are a trigger of 100,000 input tokens and keeping the last 3 tool uses. You can tune the trigger, keep, clear_at_least and exclude_tools.","k":"clear_tool_uses","src":"Context editing"},{"id":"CE-03","s":"CE","t":"s","q":"You combine context-editing strategies. Which one must be listed first?","o":["clear_thinking_20251015","clear_tool_uses_20250919","Order does not matter","The lower-trigger strategy"],"a":[0],"e":"When clear_thinking is used together with other strategies, it has to come first in the edits list.","k":"clear_thinking","src":"Context editing"},{"id":"CE-04","s":"CE","t":"s","q":"Which context-editing option prevents the results of specified tools from being cleared?","o":["exclude_tools","clear_inputs","pin_tool_uses","keep_tools"],"a":[0],"e":"exclude_tools lists tools whose results must be preserved. clear_tool_inputs controls whether the tool call parameters are cleared as well.","k":"exclude_tools","src":"Context editing"},{"id":"CE-05","s":"CE","t":"s","q":"Clearing tool results invalidates the cached prompt prefix after the cleared point. Which setting ensures clearing frees enough tokens to be worth that cost?","o":["clear_at_least","clear_tool_inputs","exclude_tools","trigger_minimum"],"a":[0],"e":"clear_at_least sets the minimum number of tokens to remove each time, so you do not break the cache for a trivial saving.","k":"clear_at_least","src":"Context editing"},{"id":"CE-06","s":"CE","t":"s","q":"A coding agent's context is dominated by raw output from tool calls made 50 turns ago, which it has already acted on. What is the safest first thing to prune?","o":["The stale tool results, while keeping a record of which tools were called","The system prompt, because the agent already read its instructions earlier in the run","The latest user instruction, because the agent has already started working on it","The definitions of the tools in use, since the tool_use history already shows their names"],"a":[0],"e":"Tool results that have been processed are the best candidates for clearing: they are bulky and rarely needed again. Context editing's clear_tool_uses strategy does exactly this by rule. Instructions and active tool definitions must stay.","k":"tool result clearing","src":"Context editing"},{"id":"CE-07","s":"CE","t":"s","q":"A workflow has five stages, and each stage needs only the previous stage's conclusion. Which design best limits context bloat?","o":["Run each stage as a separate call or subagent with fresh context, passing only the needed output forward","Chain all five stages in one long conversation so every stage can reread the raw history","Put every stage's instructions into the system prompt and run all five stages inside a single request","Run every stage in parallel inside one shared context so each sees the others' intermediate results"],"a":[0],"e":"Context isolation through multi-step workflows or subagents keeps each window focused and cheaper.","k":"context isolation","src":"Building effective agents"},{"id":"CE-08","s":"CE","t":"s","q":"Which tool design most effectively prevents tool output from bloating the context?","o":["Return only high-signal fields, with filtering, pagination and sensible truncation defaults","Return the complete raw record with every field, so Claude can choose what it needs from the full payload","Return all matching rows in a single response, with no pagination, so no follow-up call is needed","Attach full debug logs and verbose metadata to every result so Claude has full diagnostic context"],"a":[0],"e":"Tools should return what the model needs for the next decision. Large payloads waste context and distract the model.","k":"tool output pruning","src":"Writing tools for agents"},{"id":"CE-09","s":"CE","t":"s","q":"A long-running agent forgets a constraint stated 100 turns ago. Which mitigation is appropriate?","o":["Keep durable constraints in the system prompt or a persisted notes file, and restate them after compaction","Raise the temperature so the model explores more of its earlier context and recalls the constraint","State the constraint once in the first user message and rely on the model's attention to carry it forward","Lower max_tokens so each reply stays short, which leaves more room for early turns in the window"],"a":[0],"e":"Information that must persist belongs in stable places that survive pruning and summarization.","k":"context drift","src":"Context windows"},{"id":"CE-10","s":"CE","t":"s","q":"Which approach follows just-in-time context retrieval for a coding agent?","o":["Keep lightweight references such as file paths and fetch file contents with tools when needed","Pre-load the full contents of every file in the repository at startup, so no tool call is needed later","Paste an index of file summaries into the system prompt and skip tool calls to read the files","Copy the contents of the most recently modified files into the prompt up front and refresh them every turn"],"a":[0],"e":"Loading identifiers and retrieving details on demand keeps the window small and relevant.","k":"just-in-time retrieval","src":"Context engineering"},{"id":"CE-11","s":"CE","t":"s","q":"What is structured note-taking (agentic memory) in context engineering?","o":["The agent writes notes to storage outside the context window and reads them back when needed","The model stores the conversation in its own weights during inference and recalls it in later sessions","The prompt is written as structured bullet points so the model can skim the instructions faster","The agent raises max_tokens so it can keep a longer log of its work in the window"],"a":[0],"e":"Persistent notes let an agent keep progress across context resets or sessions without carrying every detail in the window.","k":"structured note-taking, memory","src":"Context engineering"},{"id":"PE-01","s":"PE","t":"s","q":"Which test does Anthropic's golden rule of prompting suggest?","o":["Show your prompt to a colleague with minimal context; if they would be confused, Claude likely will be too","Run the prompt at temperature 0 three times; if the outputs differ, the prompt is ambiguous and needs rewriting","Ask Claude to rate your prompt out of ten; any score below eight means the prompt
